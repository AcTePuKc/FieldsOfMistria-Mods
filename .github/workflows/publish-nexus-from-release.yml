name: Publish Selected Mod to Nexus

# Deliberately manual. A GitHub release must never publish every archive in it.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Registry key for the single mod to publish
        required: true
        type: string
      version:
        description: Exact MAJOR.MINOR.PATCH version, for example 0.1.0
        required: true
        type: string
      tag:
        description: GitHub release tag containing this one archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-${{ inputs.target }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      REPOSITORY: AcTePuKc/FieldsOfMistria-Mods
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve one target and validate inputs
        id: target
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must use MAJOR.MINOR.PATCH format." }

          $registry = Get-Content -LiteralPath "release/nexus-targets.json" -Raw | ConvertFrom-Json -AsHashtable
          $target = $registry["${{ inputs.target }}"]
          if ($null -eq $target) { throw "Unknown target: ${{ inputs.target }}. Add it to release/nexus-targets.json first." }
          foreach ($field in @("asset_prefix", "manifest_id", "release_root", "display_name", "mod_id_secret", "file_id_secret")) {
            if ([string]::IsNullOrWhiteSpace([string]$target[$field])) { throw "Target ${{ inputs.target }} is missing registry field: $field" }
          }

          $assetName = "$($target.asset_prefix)-$version.zip"
          $manifestId = [string]$target.manifest_id
          $releaseRoot = [string]$target.release_root
          $displayName = "$($target.display_name) $version"

          $changelogPath = Join-Path $releaseRoot "nexus-changelog.txt"
          $changelog = if (Test-Path -LiteralPath $changelogPath) { (Get-Content -LiteralPath $changelogPath -Raw).Trim() } else { "" }
          if ([string]::IsNullOrWhiteSpace($changelog)) { throw "Nexus changelog is missing or empty: $changelogPath" }

          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "manifest_id=$manifestId" >> $env:GITHUB_OUTPUT
          "display_name=$displayName" >> $env:GITHUB_OUTPUT
          "mod_id_secret=$($target.mod_id_secret)" >> $env:GITHUB_OUTPUT
          "file_id_secret=$($target.file_id_secret)" >> $env:GITHUB_OUTPUT
          "release_root=$releaseRoot" >> $env:GITHUB_OUTPUT
          "changelog<<EOF" >> $env:GITHUB_OUTPUT
          $changelog >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Load selected Nexus settings
        id: nexus_settings
        shell: pwsh
        env:
          MOD_PAGE_ID: ${{ secrets[steps.target.outputs.mod_id_secret] }}
          FILE_ID: ${{ secrets[steps.target.outputs.file_id_secret] }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXUS_API_KEY) -or [string]::IsNullOrWhiteSpace($env:MOD_PAGE_ID)) {
            throw "The selected target is missing its Nexus API key or page-ID secret."
          }
          "mod_page_id=$env:MOD_PAGE_ID" >> $env:GITHUB_OUTPUT
          "file_id=$env:FILE_ID" >> $env:GITHUB_OUTPUT
          "first_publish=$([string]::IsNullOrWhiteSpace($env:FILE_ID).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Download only the selected release archive
        id: download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path .\release-download | Out-Null
          gh release download "${{ inputs.tag }}" --repo $env:REPOSITORY --pattern "${{ steps.target.outputs.asset_name }}" --dir .\release-download
          $archive = Join-Path $PWD "release-download/${{ steps.target.outputs.asset_name }}"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Selected archive is missing: $archive" }
          "asset_path=$archive" >> $env:GITHUB_OUTPUT

      - name: Validate selected archive manifest
        shell: pwsh
        run: |
          $extractPath = Join-Path $PWD "release-archive-check"
          Expand-Archive -LiteralPath "${{ steps.download.outputs.asset_path }}" -DestinationPath $extractPath -Force
          $manifests = @(Get-ChildItem -LiteralPath $extractPath -Recurse -File -Filter manifest.toml)
          if ($manifests.Count -ne 1) { throw "Expected exactly one manifest.toml; found $($manifests.Count)." }
          $manifestText = Get-Content -LiteralPath $manifests[0].FullName -Raw
          $manifestId = [regex]::Match($manifestText, '(?m)^id\s*=\s*"([^"]+)"\s*$').Groups[1].Value
          $manifestVersion = [regex]::Match($manifestText, '(?m)^version\s*=\s*"([^"]+)"\s*$').Groups[1].Value
          if ($manifestId -ne "${{ steps.target.outputs.manifest_id }}") { throw "Archive manifest ID does not match selected target." }
          if ($manifestVersion -ne "${{ inputs.version }}") { throw "Archive manifest version does not match requested version." }

      - name: Resolve Nexus internal mod ID
        id: nexus_mod
        shell: pwsh
        run: |
          $headers = @{ apikey = $env:NEXUS_API_KEY; "User-Agent" = "FieldsOfMistria-mod-release-workflow" }
          $uri = "https://api.nexusmods.com/v3/games/fieldsofmistria/mods/${{ steps.nexus_settings.outputs.mod_page_id }}"
          $mod = Invoke-RestMethod -Uri $uri -Headers $headers
          if ([string]::IsNullOrWhiteSpace([string]$mod.data.id)) { throw "Nexus did not return an internal mod ID." }
          "mod_id=$($mod.data.id)" >> $env:GITHUB_OUTPUT

      - name: Create the first Nexus main file
        if: steps.nexus_settings.outputs.first_publish == 'true'
        id: first_publish
        shell: pwsh
        run: |
          $headers = @{ apikey = $env:NEXUS_API_KEY; "User-Agent" = "FieldsOfMistria-mod-release-workflow" }
          $archive = "${{ steps.download.outputs.asset_path }}"
          $asset = Get-Item -LiteralPath $archive
          $changelog = (Get-Content -LiteralPath "${{ steps.target.outputs.release_root }}/nexus-changelog.txt" -Raw).Trim()

          function Invoke-NexusJson($Method, $Path, $Body = $null) {
            $uri = "https://api.nexusmods.com/v3$Path"
            if ($null -eq $Body) { return Invoke-RestMethod -Method $Method -Uri $uri -Headers $headers }
            return Invoke-RestMethod -Method $Method -Uri $uri -Headers $headers -ContentType "application/json" -Body ($Body | ConvertTo-Json -Depth 8)
          }

          $upload = Invoke-NexusJson "POST" "/uploads/multipart" @{ size_bytes = $asset.Length.ToString(); filename = $asset.Name }
          $uploadId = [string]$upload.data.id
          $partUrls = @($upload.data.part_presigned_urls)
          $partSize = [int64]$upload.data.part_size_bytes
          $completeUrl = [string]$upload.data.complete_presigned_url
          if ([string]::IsNullOrWhiteSpace($uploadId) -or $partUrls.Count -eq 0 -or $partSize -le 0 -or [string]::IsNullOrWhiteSpace($completeUrl)) { throw "Nexus did not create a multipart upload session." }

          $stream = [System.IO.File]::OpenRead($asset.FullName)
          $client = [System.Net.Http.HttpClient]::new()
          $parts = @()
          try {
            for ($index = 0; $index -lt $partUrls.Count; $index++) {
              $remaining = $asset.Length - $stream.Position
              if ($remaining -le 0) { throw "Nexus returned more upload parts than the archive needs." }
              $length = [int][Math]::Min($partSize, $remaining)
              $bytes = [byte[]]::new($length)
              $read = 0
              while ($read -lt $length) {
                $count = $stream.Read($bytes, $read, $length - $read)
                if ($count -le 0) { throw "Could not read the selected archive." }
                $read += $count
              }
              $request = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Put, [string]$partUrls[$index])
              $content = [System.Net.Http.ByteArrayContent]::new($bytes)
              $content.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse("application/octet-stream")
              $content.Headers.ContentLength = $read
              $request.Content = $content
              $response = $client.Send($request)
              if (-not $response.IsSuccessStatusCode) { throw "Nexus storage upload failed for part $($index + 1): $([int]$response.StatusCode)." }
              $etag = [string]$response.Headers.ETag.Tag
              if ([string]::IsNullOrWhiteSpace($etag)) { throw "Nexus storage did not return an ETag for part $($index + 1)." }
              $parts += [pscustomobject]@{ Number = $index + 1; ETag = $etag }
            }
            if ($stream.Position -ne $asset.Length) { throw "Nexus returned too few upload parts for the archive." }
            $xmlParts = ($parts | ForEach-Object { "  <Part><PartNumber>$($_.Number)</PartNumber><ETag>$($_.ETag)</ETag></Part>" }) -join "`n"
            $xml = "<CompleteMultipartUpload>`n$xmlParts`n</CompleteMultipartUpload>"
            $completeRequest = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Post, $completeUrl)
            $completeRequest.Content = [System.Net.Http.StringContent]::new($xml, [System.Text.Encoding]::UTF8, "application/xml")
            $completeResponse = $client.Send($completeRequest)
            if (-not $completeResponse.IsSuccessStatusCode) { throw "Nexus multipart completion failed: $([int]$completeResponse.StatusCode)." }
          } finally {
            $stream.Dispose()
            $client.Dispose()
          }
          Invoke-NexusJson "POST" "/uploads/$uploadId/finalise" | Out-Null

          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 2
            $status = Invoke-NexusJson "GET" "/uploads/$uploadId"
          } while ($status.data.state -ne "available" -and (Get-Date) -lt $deadline)
          if ($status.data.state -ne "available") { throw "Nexus upload did not become available within five minutes." }

          $created = Invoke-NexusJson "POST" "/mod-files" @{
            upload_id = $uploadId
            mod_id = "${{ steps.nexus_mod.outputs.mod_id }}"
            name = "${{ steps.target.outputs.display_name }}"
            description = $changelog
            version = "${{ inputs.version }}"
            file_category = "main"
            primary_mod_manager_download = $true
            allow_mod_manager_download = $true
            show_requirements_pop_up = $false
          }
          $newFileId = [string]$created.data.id
          if ([string]::IsNullOrWhiteSpace($newFileId)) { throw "Nexus created the file but did not return its File ID." }
          Write-Host "::notice title=Nexus internal ModFile ID (not File/Group ID)::$newFileId"

      - name: Publish an update to Nexus Mods
        if: steps.nexus_settings.outputs.first_publish != 'true'
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ steps.nexus_settings.outputs.file_id }}
          mod_id: ${{ steps.nexus_mod.outputs.mod_id }}
          filename: ${{ steps.download.outputs.asset_path }}
          version: ${{ inputs.version }}
          changelog: ${{ steps.target.outputs.changelog }}
          display_name: ${{ steps.target.outputs.display_name }}
          category: main
          archive_existing_version: true
          update_mod_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          show_requirements_pop_up: false
