name: Publish Nexus From Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish to Nexus
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      REPOSITORY: AcTePuKc/FieldsOfMistria-Mods

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve GitHub release and Nexus changelog
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          }
          else {
            $tag = "${{ inputs.tag }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "A GitHub release tag is required."
          }

          $release = gh release view $tag --repo $env:REPOSITORY --json tagName | ConvertFrom-Json
          $version = $release.tagName.TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not resolve a version from tag '$tag'."
          }

          $changelogPath = "release/nexus-changelog.txt"
          if (-not (Test-Path -LiteralPath $changelogPath)) {
            throw "Nexus changelog is missing: $changelogPath"
          }

          $changelog = (Get-Content -LiteralPath $changelogPath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($changelog)) {
            throw "release/nexus-changelog.txt must not be empty."
          }

          "tag=$($release.tagName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "changelog<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $changelog | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download release archive
        id: download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path .\release-download | Out-Null
          gh release download "${{ steps.release.outputs.tag }}" `
            --repo $env:REPOSITORY `
            --pattern "FieldsOfMistriaBulgarian-*.zip" `
            --dir .\release-download

          $archives = @(Get-ChildItem -LiteralPath .\release-download -Filter "FieldsOfMistriaBulgarian-*.zip")
          if ($archives.Count -ne 1) {
            throw "Expected exactly one FieldsOfMistriaBulgarian zip asset, found $($archives.Count)."
          }

          "asset_path=$($archives[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve Nexus internal mod ID
        id: nexus_mod
        shell: pwsh
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_MOD_PAGE_ID: ${{ secrets.NEXUS_MOD_ID }}
        run: |
          $headers = @{
            apikey = $env:NEXUS_API_KEY
            "User-Agent" = "FieldsOfMistriaBulgarian-release-workflow"
          }
          $uri = "https://api.nexusmods.com/v3/games/fieldsofmistria/mods/$($env:NEXUS_MOD_PAGE_ID)"
          $mod = Invoke-RestMethod -Uri $uri -Headers $headers
          if ([string]::IsNullOrWhiteSpace([string]$mod.data.id)) {
            throw "Nexus did not return an internal mod ID for page ID '$($env:NEXUS_MOD_PAGE_ID)'."
          }
          "mod_id=$($mod.data.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          # Nexus calls this the Group ID in its UI; the action keeps the older
          # input name file_id. Both refer to the existing file update chain.
          file_id: ${{ secrets.NEXUS_FILE_ID }}
          mod_id: ${{ steps.nexus_mod.outputs.mod_id }}
          filename: ${{ steps.download.outputs.asset_path }}
          version: ${{ steps.release.outputs.version }}
          changelog: ${{ steps.release.outputs.changelog }}
          display_name: FieldsOfMistriaBulgarian ${{ steps.release.outputs.version }}
          category: main
          archive_existing_version: true
          update_mod_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          show_requirements_pop_up: false
