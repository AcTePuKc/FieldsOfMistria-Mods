name: Split temporary dialogue reference

on:
  push:
    branches:
      - temp-translation
    paths:
      - .github/workflows/split-dialogue-temp.yml

permissions:
  contents: write

jobs:
  split-dialogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-translation

      - name: Split dialogue TSV by localization key
        shell: python
        run: |
          import csv
          import re
          from collections import defaultdict
          from pathlib import Path

          source = Path("translation/review/dialogue.tsv")
          output_dir = source.parent
          columns = ("key", "english", "french", "russian", "bulgarian")

          def filename_part(value: str) -> str:
              value = re.sub(r"[^0-9A-Za-z]+", "_", value).strip("_").lower()
              return value or "misc"

          def category(key: str) -> str:
              parts = key.split("/")
              root = parts[0]
              if root == "Conversations":
                  if len(parts) < 2:
                      return "dialogue_conversations_misc"
                  section = parts[1]
                  if section == "Bank" and len(parts) >= 3:
                      return f"dialogue_bank_{filename_part(parts[2])}"
                  if section == "Activity Dialogue" and len(parts) >= 3:
                      return f"dialogue_activity_{filename_part(parts[2])}"
                  return f"dialogue_{filename_part(section)}"
              if root == "Cutscenes":
                  if len(parts) >= 2:
                      return f"dialogue_cutscenes_{filename_part(parts[1])}"
                  return "dialogue_cutscenes_misc"
              if root == "letters":
                  return "dialogue_letters"
              return "dialogue_misc"

          groups = defaultdict(list)
          with source.open("r", encoding="utf-8-sig", newline="") as stream:
              reader = csv.DictReader(stream, delimiter="\t")
              if tuple(reader.fieldnames or ()) != columns:
                  raise SystemExit(f"Unexpected TSV columns: {reader.fieldnames}")
              for row in reader:
                  groups[category(row["key"])].append(tuple(row[column] for column in columns))

          for old_file in output_dir.glob("dialogue_*.tsv"):
              old_file.unlink()

          for name, rows in sorted(groups.items()):
              path = output_dir / f"{name}.tsv"
              with path.open("w", encoding="utf-8-sig", newline="") as stream:
                  writer = csv.writer(stream, delimiter="\t", lineterminator="\n")
                  writer.writerow(columns)
                  writer.writerows(rows)
              print(f"{path}: {len(rows)} rows, {path.stat().st_size} bytes")

          source.unlink()
          print(f"Split {sum(map(len, groups.values()))} rows into {len(groups)} files")

      - name: Commit split reference files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- translation/review/dialogue.tsv
          git add -- translation/review/dialogue_*.tsv
          git commit -m "Раздели големия файл с диалози"
          git push origin HEAD:temp-translation
