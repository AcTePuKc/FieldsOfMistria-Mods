# Bulgarian language registration template.
# Asset IDs are stable project identifiers for the eventual package and must
# match the translation and source-cache metadata used by the injector.
[asset_properties.languages.bul]
display_name = "Български"
translation = "a1f64c8d2e9b7035"
src_cache = "c7b90e15d4a2863f"
ship = false
default_pronoun = "he_him"
automatic_linebreaks = true
date_order = "DayFirst"
infusion_order = "Adjective"
infusion_space = " "
commas_in_numbers = true
common_button_height = 19
pronoun_display_order = ["they_them", "she_her", "he_him", "it_its", "all", "none"]

[asset_properties.languages.bul.pronouns]
they_them = { display = "Те / Тях", macros = ["they"] }
she_her = { display = "Тя / Нея", macros = ["she"] }
he_him = { display = "Той / Него", macros = ["he"] }
it_its = { display = "То / Него", macros = ["it"] }
all = { display = "Всички", macros = ["they", "he", "she", "it"] }
none = { display = "Без местоимение", macros = ["none"] }
