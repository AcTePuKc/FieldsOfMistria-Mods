[asset_properties]
"items/other/crops_and_forage/acorn/name" = "Жълъд"
"items/other/crops_and_forage/acorn/description" = "Ядката на дъбово дърво. Използва се в рецепти за готвене и изработка."
"items/other/crops_and_forage/bell_berry/name" = "Камбанкова ягода"
"items/other/crops_and_forage/bell_berry/description" = "Дива ягода, която се намира през всички сезони. Тези сладки плодове с необичайна форма се срещат само в Мистрия. Понякога се използват в готвенето."
"items/other/crops_and_forage/pinecone/name" = "Шишарка"
"items/other/crops_and_forage/pinecone/description" = "Шишарка със семената на бор. Използва се в определени рецепти за изработка."
"items/other/crops_and_forage/sesame/name" = "Сусам"
"items/other/crops_and_forage/sesame/description" = "Диво растение, което се намира през лятото. Има мек ядков вкус и често се използва в готвенето."
"items/other/crops_and_forage/sunflower/name" = "Слънчоглед"
"items/other/crops_and_forage/sunflower/description" = "Весело жълто цвете, което расте през лятото. Може да се използва в рецепти за готвене и изработка."
"items/other/crops_and_forage/seed_sunflower/name" = "Семена от слънчоглед"
"items/other/crops_and_forage/seed_sunflower/description" = "Семена от слънчоглед. Това лятно цвете се прибира веднъж."
"items/other/crops_and_forage/temple_flower/name" = "Плумерия"
"items/other/crops_and_forage/temple_flower/description" = "Диво цвете, което се намира през всички сезони. По неизвестна причина расте единствено около Храма на Калдарус."
"items/other/crops_and_forage/seed_temple_flower/name" = "Семена от плумерия"
"items/other/crops_and_forage/seed_temple_flower/description" = "Семена от плумерия. Това целогодишно цвете се прибира на всеки 3 дни, след като узрее."
"items/other/crops_and_forage/thorn_vine/name" = "Бодлива лоза"
"items/other/crops_and_forage/thorn_vine/description" = "Диво растение, което се намира през всички сезони. Освен че е изключително жилаво, това бодливо растение расте много бързо."
"items/other/crops_and_forage/walnut/name" = "Орех"
"items/other/crops_and_forage/walnut/description" = "Дива ядка, която се намира през всички сезони. Много е хранителна, има земен вкус и понякога се използва в готвенето."
"items/other/crops_and_forage/water_chestnut/name" = "Воден кестен"
"items/other/crops_and_forage/water_chestnut/description" = "Инвазивен вид, донесен в Мистрия от останалата част на Алдария. Използва се като съставка в готвенето."
"items/other/crops_and_forage/wintergreen_berry/name" = "Плод на гоултерия"
"items/other/crops_and_forage/wintergreen_berry/description" = "Прекрасен зимен плод. Използва се в различни рецепти."
