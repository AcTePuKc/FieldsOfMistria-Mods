[asset_properties]
"ui/tutorials/animal_sprite_statue/steps/0/text" = "Постави статуя на животински дух\nв голяма плевня или курник.\nТя гали животните всеки ден."
"ui/tutorials/animal_sprite_statue/steps/1/text" = "Зареди статуята с камък\nот есенция, за да работи."
"ui/tutorials/animal_sprite_statue/steps/2/text" = "По-големите камъни от есенция\nдържат заряд за повече дни."
"ui/tutorials/animal_sprite_statue/steps/3/text" = "Камъни от есенция се правят\nслед отключване на пречиствател\nза камъни."
"ui/tutorials/animal_sprite_statue/steps/4/text" = "Понякога има камъни от есенция\nи в сандъци в Мините!"
"ui/tutorials/animal_sprite_statue/title" = "Урок: Статуи на животински дух"
