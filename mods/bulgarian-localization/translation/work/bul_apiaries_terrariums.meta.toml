[meta_properties]
id = "fom-bg-work-apiaries-terrariums"
asset_kind = "L10nTarget"

[asset_properties]
"ui/tutorials/apiaries_and_terrariums/steps/0/text" = "Постави пчелини и терариуми\nвъв фермата си.\nНапълни ги с пчели и насекоми."
"ui/tutorials/apiaries_and_terrariums/steps/1/text" = "Сложи различни пчели в пчелина,\nза да получаваш мед\nсъс същата рядкост."
"ui/tutorials/apiaries_and_terrariums/steps/2/text" = "4 легендарни пчели в пчелин\nпроизвеждат легендарен мед."
"ui/tutorials/apiaries_and_terrariums/steps/3/text" = "Терариумите произвеждат\nферомони за насекоми и стръв\nспоред рядкостта на насекомите."
"ui/tutorials/apiaries_and_terrariums/steps/4/text" = "На всеки 3 дни пчелите\nи насекомите искат храна."
"ui/tutorials/apiaries_and_terrariums/steps/5/text" = "Нахрани ги, за да получиш\nмед, феромони за насекоми\nили стръв за риба."
"ui/tutorials/apiaries_and_terrariums/steps/6/text" = "Ползвай феромон на открито,\nза да призовеш насекомо\nи да го уловиш."
"ui/tutorials/apiaries_and_terrariums/steps/7/text" = "Рядкостта на насекомото\nсъвпада с тази на феромона."
"ui/tutorials/apiaries_and_terrariums/steps/8/text" = "Ползвай стръв в открита вода,\nза да призовеш риба\nи да я уловиш."
"ui/tutorials/apiaries_and_terrariums/steps/9/text" = "Рядкостта на рибата съвпада\nс тази на използваната стръв."
"ui/tutorials/apiaries_and_terrariums/steps/10/text" = "Стръвта може да се залага\nв капана за риба на западния\nПлаж."
"ui/tutorials/apiaries_and_terrariums/title" = "Урок: Пчелини и терариуми"
