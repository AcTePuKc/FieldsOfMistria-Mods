"items/other/artifacts/ancient_gold_coin/name" = "Древна златна монета"
"items/other/artifacts/ancient_gold_coin/description" = "Необичаен артефакт. От едната страна е гравиран силуетът на Вещата кралица, а от другата — великолепна кула."
"items/other/artifacts/ancient_horn_circlet/name" = "Древна рогата диадема"
"items/other/artifacts/ancient_horn_circlet/description" = "Рядък артефакт. Рогата диадема от епохата на Вещите кралици. Дали е била моден аксесоар, или е имала по-важна цел?"
"items/other/artifacts/ancient_royal_scepter/name" = "Древен кралски скиптър"
