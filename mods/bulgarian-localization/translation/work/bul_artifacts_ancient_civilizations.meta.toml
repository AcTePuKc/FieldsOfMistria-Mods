"items/other/artifacts/ancient_stone_lantern/name" = "Древен каменен фенер"
"items/other/artifacts/ancient_stone_lantern/description" = "Необичаен артефакт. Невъзможно изящен каменен фенер от епохата на Вещите кралици. Още пази неземно сияние отвътре."
"items/other/artifacts/black_tablet/name" = "Черна плоча"
"items/other/artifacts/black_tablet/description" = "Необичаен артефакт. Направен е от странен метал и не е ясно за какво служи."
"items/other/artifacts/caldosian_breastplate/name" = "Калдосиански нагръдник"
"items/other/artifacts/caldosian_breastplate/description" = "Рядък артефакт. Този великолепен нагръдник е толкова богато украсен, че вероятно е служил за церемонии."
"items/other/artifacts/caldosian_drinking_horn/name" = "Калдосиански рог за пиене"
"items/other/artifacts/caldosian_drinking_horn/description" = "Рядък артефакт. Роговете за пиене обикновено са се предавали по семейна линия."
"items/other/artifacts/caldosian_emperor_bust/name" = "Бюст на калдосиански император"
"items/other/artifacts/caldosian_emperor_bust/description" = "Необичаен артефакт. Бюст на калдосиански император. Не е ясно на кой."
"items/other/artifacts/caldosian_sword/name" = "Калдосиански меч"
"items/other/artifacts/caldosian_sword/description" = "Необичаен артефакт. Меч на имперски офицер от ранните дни на Калдосианската империя."
"items/other/artifacts/clay_amphora/name" = "Глинена амфора"
