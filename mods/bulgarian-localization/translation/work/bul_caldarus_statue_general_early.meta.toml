"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_elsie/1" = "Тази Елси звучи като човек, който се е научил да живее пълноценно. <he>Може да научиш много от нея</he><she>Може да научиш много от нея</she><they>Можете да научите много от нея</they>."
