"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_landen/1" = "От това, което казваш за Ландън, ми е трудно да разбера какво всъщност представлява това нещо, наречено „пенсиониране“."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_louis/init" = "Усещаш неудържим порив да поговориш със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_louis/1" = "Луи е шивач? Колко интересно. Чудя се как се е променила модата през цялото това време..."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_luc/init" = "Усещаш неудържим порив да поговориш със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_luc/1" = "Мило е от твоя страна да помагаш на Люк в търсенето му на буболечки. И аз ще ти кажа, ако видя някоя по-особена."
