"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_maple/1" = "Казваш, че Мейпъл иска да стане следващата кралица? Предстои ѝ дълъг път, подозирам, че мнозина се борят за тази позиция."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_march/init" = "Усещаш неудържим порив да поговориш със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_march/1" = "Странно е, че макар Марч да е спечелил толкова награди за работата си, не е спечелил нито една за характера си."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_march/2" = "Може би нещо, което да подхванеш следващия път, когато говориш с него?"
