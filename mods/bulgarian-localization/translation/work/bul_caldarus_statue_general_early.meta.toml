"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_landen/1" = "От това, което <he>казваш за Ландън, ми е трудно да разбера какво всъщност представлява това нещо, наречено „пенсиониране“</he><she>казваш за Ландън, ми е трудно да разбера какво всъщност представлява това нещо, наречено „пенсиониране“</she><they>казвате за Ландън, ми е трудно да разбера какво всъщност представлява това нещо, наречено „пенсиониране“</they>."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_louis/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_louis/1" = "Луи е шивач? Колко интересно. Чудя се как се е променила модата през цялото това време..."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_luc/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_luc/1" = "Мило е от <he>твоя страна да помагаш на Люк в търсенето му на буболечки. И аз ще ти кажа, ако видя някоя по-особена</he><she>твоя страна да помагаш на Люк в търсенето му на буболечки. И аз ще ти кажа, ако видя някоя по-особена</she><they>ваша страна да помагате на Люк в търсенето му на буболечки. И аз ще ви кажа, ако видя някоя по-особена</they>."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_maple/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_maple/1" = "<he>Казваш</he><she>Казваш</she><they>Казвате</they>, че Мейпъл иска да стане следващата кралица? Предстои ѝ дълъг път, подозирам, че мнозина се борят за тази позиция."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_march/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_march/1" = "Странно е, че макар Марч да е спечелил толкова награди за работата си, не е спечелил нито една за характера си."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_march/2" = "Може би нещо, което да <he>подхванеш следващия път, когато говориш с него</he><she>подхванеш следващия път, когато говориш с него</she><they>подхванете следващия път, когато говорите с него</they>?"
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_nora/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_nora/1" = "Значи Нора организира Съботния пазар? Колко похвално."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_olric/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_olric/1" = "Олрик ми изглежда надежден човек. <he>Гледай да оправдаеш доверието му, [Ari]</he><she>Гледай да оправдаеш доверието му, [Ari]</she><they>Гледайте да оправдаете доверието му, [Ari]</they>."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_reina/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_reina/1" = "Ястията, които Рейна приготвя, звучат много апетитно. На драконите не им се налага да ядат, но признавам, че на мен ми е приятно."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_ryis/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_ryis/1" = "Този Райс, за когото <he>споменаваш</he><she>споменаваш</she><they>споменавате</they>, понякога се чува дори дотук, докато работи по дърводелските си проекти. Май нещата, които вие, смъртните, строите, все се разпадат."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_terithia/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_terithia/1" = "Изглежда с Терития имаме много общо. Някой ден бих искал да поговоря с нея за вкусната риба край бреговете на Мистрия."
