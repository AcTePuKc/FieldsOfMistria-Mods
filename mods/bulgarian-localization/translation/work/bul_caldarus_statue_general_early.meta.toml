"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_balor/1" = "Признавам, че нямам много вземане-даване с търговци, затова не мога да кажа дали на този Балор може да се разчита. На драконите рядко им се налага да „купуват“ разни неща."
