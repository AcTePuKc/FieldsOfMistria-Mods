"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_josephine/1" = "Името на Хана на Спящия дракон, който Жозефин управлява, много ме заинтригува. Дали предците на семейството са ме помнили?"
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_juniper/init" = "Усещаш неудържим порив да поговориш със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_juniper/1" = "Значи Джунипър управлява баня с води, които възстановяват здравето и издръжливостта ти? Звучи почти магически."
