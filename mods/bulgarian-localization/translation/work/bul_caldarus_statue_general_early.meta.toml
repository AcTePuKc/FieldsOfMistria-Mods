"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_dozy/1" = "Това много добро момче, Доузи, за което <he>говориш</he><she>говориш</she><they>говорите</they>... бих искал да се запозная с такава благородна душа."
