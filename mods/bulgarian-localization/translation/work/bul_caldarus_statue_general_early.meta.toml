"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_ryis/1" = "Този Райс, за когото споменаваш, понякога се чува дори дотук, докато работи по дърводелските си проекти. Май нещата, които вие, смъртните, строите, все се разпадат."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_terithia/init" = "Усещаш неудържим порив да поговориш със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_terithia/1" = "Изглежда с Терития имаме много общо. Някой ден бих искал да поговоря с нея за вкусната риба край бреговете на Мистрия."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_valen/init" = "Усещаш неудържим порив да поговориш със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_valen/1" = "Драконите рядко боледуват. Добре е да чуя, че доктор Вален може да се погрижи за смъртните ти недъзи."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_vera/init" = "Усещаш неудържим порив да поговориш със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_vera/1" = "Тази Вера оформя косата ти? Колко интересно. Чудя се каква прическа би ми препоръчала..."
