"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_juniper/1" = "Значи Джунипър управлява баня с води, които възстановяват здравето и издръжливостта <he>ти</he><she>ти</she><they>ви</they>? Звучи почти магически."
