"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_olric/1" = "Олрик ми изглежда надежден човек. Гледай да оправдаеш доверието му, [Ari]."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_reina/init" = "Усещаш неудържим порив да поговориш със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_reina/1" = "Ястията, които Рейна приготвя, звучат много апетитно. На драконите не им се налага да ядат, но признавам, че на мен ми е приятно."
