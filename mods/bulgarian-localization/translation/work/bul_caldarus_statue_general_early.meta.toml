"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_hemlock/1" = "<he>Казваш</he><she>Казваш</she><they>Казвате</they>, че Хемлок е познавач на напитките? Хм... бих искал да опитам от майсторството му."
