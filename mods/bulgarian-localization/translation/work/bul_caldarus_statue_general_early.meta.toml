"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_henrietta/1" = "<he>Извинявай, да не съм чул погрешно? Тази Хенриета, за която говориш, е кокошка? Предположих, че говорим за човек</he><she>Извинявай, да не съм чул погрешно? Тази Хенриета, за която говориш, е кокошка? Предположих, че говорим за човек</she><they>Извинявайте, да не съм чул погрешно? Тази Хенриета, за която говорите, е кокошка? Предположих, че говорим за човек</they>."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_holt/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_holt/1" = "Холт обича каламбурите? В моето време подобно поведение почти се смяташе за престъпление."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_josephine/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_josephine/1" = "Името на Хана на Спящия дракон, който Жозефин управлява, много ме заинтригува. Дали предците на семейството са ме помнили?"
