"Conversations/Bank/Caldarus/Statue Lines/general_lines/townsfolk_adeline/1" = "Тази Аделайн, за която <he>говориш</he><she>говориш</she><they>говорите</they>, изглежда разумна. Рядко се среща човек, който искрено се грижи за всички около себе си."
