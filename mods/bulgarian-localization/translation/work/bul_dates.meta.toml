[meta_properties]
id = "fom-bg-work-dates"
asset_kind = "L10nTarget"

[asset_properties]
"ui/tutorials/dates/steps/0/text" = "Избери романтичната линия\nв събитие с 8 сърца,\nза да започнеш връзка!"
"ui/tutorials/dates/steps/1/text" = "Можеш да се срещаш с повече\nот един човек, но брак\nсе сключва само с един."
"ui/tutorials/dates/steps/2/text" = "След началото на връзка\nпокани човека на среща\nв събота или неделя."
"ui/tutorials/dates/steps/3/text" = "С всеки човек можеш да имаш\nпо една среща седмично."
"ui/tutorials/dates/steps/4/text" = "При две връзки можеш да имаш\nсреща и в събота, и в неделя."
"ui/tutorials/dates/steps/5/text" = "Идеите за срещи отключват\nнови видове срещи!"
"ui/tutorials/dates/steps/6/text" = "Идеи за срещи се намират\nпри различни дейности\nили се купуват от търговец."
"ui/tutorials/dates/steps/7/text" = "При първа среща от нов вид\nще получиш снимка от нея!"
"ui/tutorials/dates/steps/8/text" = "Окачи снимките от срещи\nпо стените у дома,\nза да ги разглеждаш."
"ui/tutorials/dates/steps/9/text" = "При по-висок лимит на сърцата\nсрещите ще дават повече точки\nза сърца от подаръците."
"ui/tutorials/dates/title" = "Урок: Срещи"
