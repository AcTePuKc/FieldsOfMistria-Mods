[asset_properties]
"items/mines/deep_earth/crystal/name" = "Кристал"
"items/mines/deep_earth/crystal/description" = "Кристална отломка. Използва се в рецепти за изработка."
"items/mines/deep_earth/crystal_berries/name" = "Кристални ягоди"
"items/mines/deep_earth/crystal_berries/description" = "Тези ягоди приличат на стъкло и са много сладки."
"items/mines/deep_earth/crystal_rose/name" = "Кристална роза"
"items/mines/deep_earth/crystal_rose/description" = "Тази нежна блестяща роза сякаш е направена от кристал."
"items/mines/deep_earth/crystal_wing_moth/name" = "Кристалнокрила пеперуда"
"items/mines/deep_earth/crystal_wing_moth/description" = "Рядко насекомо от Земните недра. Нежните му крила отразяват светлината и го карат да блести."
"items/mines/deep_earth/crystalline_cricket/name" = "Кристален щурец"
"items/mines/deep_earth/crystalline_cricket/description" = "Обичайно насекомо от Земните недра. Камъните около него вибрират в ритъма на песента му."
"items/mines/deep_earth/deep_earthworm/name" = "Червей от недрата"
"items/mines/deep_earth/deep_earthworm/description" = "Необичайно насекомо от Земните недра. Съвсем различно е от братовчед си, който живее на повърхността... ако разбираш от червеи."
"items/mines/deep_earth/earth_eel/name" = "Земна змиорка"
"items/mines/deep_earth/earth_eel/description" = "Обичайна средна риба от Земните недра. Няма видима уста, та кой знае какво яде."
"items/mines/deep_earth/earth_infused_stone/name" = "Камък, пропит със земна магия"
"items/mines/deep_earth/earth_infused_stone/description" = "Необичаен артефакт. Тази скала е придобила стихийните качества на земята."
"items/mines/deep_earth/earthshroom/name" = "Земна гъба"
"items/mines/deep_earth/earthshroom/description" = "Тези гъби растат на гъсти групи и миришат силно на пръст."
"items/mines/deep_earth/emerald_horned_charger/name" = "Изумруднорога риба"
"items/mines/deep_earth/emerald_horned_charger/description" = "Рядка голяма риба от Земните недра. Почти цялата е рог, който сякаш е от чист изумруд."
"items/mines/deep_earth/faceted_rock_gem/name" = "Фасетиран камък"
"items/mines/deep_earth/faceted_rock_gem/description" = "Необичаен артефакт. Въпреки хипнотизиращия си вид на скъпоценен камък, това е само парче скала."
"items/mines/deep_earth/gem_shard_caterpillar/name" = "Гъсеница с кристални отломки"
"items/mines/deep_earth/gem_shard_caterpillar/description" = "Необичайно насекомо от Земните недра. Изглежда се храни с кристални ягоди."
"items/mines/deep_earth/pebble_minnow/name" = "Каменна елритца"
"items/mines/deep_earth/pebble_minnow/description" = "Обичайна малка риба от Земните недра. Люспите ѝ имат камениста текстура, която ѝ помага да се слива с околността."
"items/mines/deep_earth/really_round_rock/name" = "Наистина кръгъл камък"
"items/mines/deep_earth/really_round_rock/description" = "Обичаен артефакт. Този естествено образуван камък е неестествено кръгъл."
"items/mines/deep_earth/rock_roach/name" = "Каменна хлебарка"
"items/mines/deep_earth/rock_roach/description" = "Необичайно насекомо от Земните недра. По-симпатична е, отколкото би очаквал."
"items/mines/deep_earth/rock_statue/name" = "Каменна статуя"
"items/mines/deep_earth/rock_statue/description" = "Рядък артефакт. Този естествено образуван камък прилича на човек, но... сигурно е просто съвпадение."
"items/mines/deep_earth/rockbiter/name" = "Каменоядец"
"items/mines/deep_earth/rockbiter/description" = "Необичайна средна риба от Земните недра. Силно развитата ѝ челюст ѝ помага да стрива камъни."
"items/mines/deep_earth/rockroot/name" = "Каменен корен"
"items/mines/deep_earth/rockroot/description" = "Трудно е да се каже дали е част от живо растение, или само прилича на такава."
"items/mines/deep_earth/seriously_square_stone/name" = "Наистина квадратен камък"
"items/mines/deep_earth/seriously_square_stone/description" = "Обичаен артефакт. Този естествено образуван камък е съвършен квадрат — истинска наслада за ценителите на камъни."
"items/mines/deep_earth/shale_grass/name" = "Шистова трева"
"items/mines/deep_earth/shale_grass/description" = "Тази трева само изглежда, сякаш е от камък. Много е трудна за рязане."
"items/mines/deep_earth/shardfin/name" = "Отломкоперка"
"items/mines/deep_earth/shardfin/description" = "Необичайна малка риба от Земните недра. Изящната ѝ перка блести с преливащи цветове."
