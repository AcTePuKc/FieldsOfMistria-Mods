[meta_properties]
id = "fom-bg-work-dialogue-bank-dell"
asset_kind = "L10nTarget"

[asset_properties]
"Conversations/Bank/Dell/Banked Lines/ally/ally/1" = "На Драконовата стража ѝ върви, че те има за съюзник."
"Conversations/Bank/Dell/Banked Lines/ally/ally/init" = "Благодаря ти за цялата помощ, [Ari]!"
"Conversations/Bank/Dell/Banked Lines/bad_museum_visit/bad_museum_visit/1" = "Люк случайно изпусна бръмбарите си, жабата ми избяга, а на господин Ерол това ИЗОБЩО не му хареса."
"Conversations/Bank/Dell/Banked Lines/bad_museum_visit/bad_museum_visit/init" = "Миналия път, когато ходихме в музея, здравата загазихме."
"Conversations/Bank/Dell/Banked Lines/balor_lets_us_play_in_rain/balor_lets_us_play_in_rain/1" = "Могъща сила, а? Сигурно го е наследила от мен!"
"Conversations/Bank/Dell/Banked Lines/balor_lets_us_play_in_rain/balor_lets_us_play_in_rain/init" = "Господин Балор каза, че иначе би ни оставил да играем под дъжда, но мама била могъща сила, с която никога не бива да си има работа."
"Conversations/Bank/Dell/Banked Lines/basement/basement_1/init" = "[Ari]! [Ari]! Здрасти!"
"Conversations/Bank/Dell/Banked Lines/bed/bed/init" = "Лека нощ, [Ari]!"
"Conversations/Bank/Dell/Banked Lines/bedtime_story/bedtime_story/init" = "Любимата ми приказка за лека нощ е „Наръчник за начинаещи мечоносци“, но мама вече не иска да ми я чете... Чудя се защо."
"Conversations/Bank/Dell/Banked Lines/buy_potato/buy_potato/1" = "И ти нареждам да купиш един картоф!"
"Conversations/Bank/Dell/Banked Lines/buy_potato/buy_potato/init" = "Днес аз съм шефът на Смесения магазин, [Ari]."
"Conversations/Bank/Dell/Banked Lines/caldarus/dell_0_follow_up/1" = "Знам, че не трябва да ходя там, но това всъщност значи, че ТРЯБВА да отида, нали разбираш?"
"Conversations/Bank/Dell/Banked Lines/caldarus/dell_0_follow_up/2" = "Сигурна съм, че вътре има какви ли не същества! Не съм виждала нито едно, но това не значи, че не са истински. И изобщо не ме е страх от тях."
"Conversations/Bank/Dell/Banked Lines/caldarus/dell_0_follow_up/3" = "Все пак няма нищо по-страшно от мама, когато разбере, че съм ходила в Дълбоката гора."
"Conversations/Bank/Dell/Banked Lines/caldarus/dell_0_follow_up/init" = "Дълбоката гора е толкова яка, [Ari]!"
"Conversations/Bank/Dell/Banked Lines/celine_good_mood/celine_good_mood/1" = "Чакай..."
"Conversations/Bank/Dell/Banked Lines/celine_good_mood/celine_good_mood/2" = "Дали е защото вече не трябва да дели стая с мен?"
"Conversations/Bank/Dell/Banked Lines/celine_good_mood/celine_good_mood/3" = "Или защото мама не ѝ мърмори толкова много."
"Conversations/Bank/Dell/Banked Lines/celine_good_mood/celine_good_mood/4" = "Или защото вече не трябва да слуша толкова много от каламбурите на татко!"
"Conversations/Bank/Dell/Banked Lines/celine_good_mood/celine_good_mood/5" = "Да, сигурно е това!"
"Conversations/Bank/Dell/Banked Lines/celine_good_mood/celine_good_mood/init" = "Напоследък Селин е в добро настроение..."
"Conversations/Bank/Dell/Banked Lines/celine_is_the_best/celine_is_the_best/1" = "Голямата ми сестра е страхотна!"
"Conversations/Bank/Dell/Banked Lines/celine_is_the_best/celine_is_the_best/init" = "Селин знае толкова много за растенията и разни такива неща..."
"Conversations/Bank/Dell/Banked Lines/celine_knights/celine_knights/1" = "Някога сме имали рицари!"
"Conversations/Bank/Dell/Banked Lines/celine_knights/celine_knights/init" = "Харесва ми, когато Селин ни разказва много стари истории за Алдария."
"Conversations/Bank/Dell/Banked Lines/dinner_dragonguard_approved/dinner_dragonguard_approved/init" = "Вечерята тази вечер е вкусна! Значи е одобрена от Драконовата стража."
"Conversations/Bank/Dell/Banked Lines/dragon_tail/dragon_tail/1" = "Отсега нататък ще те наричаме... ОПАШКАТА НА ДРАКОНА!"
"Conversations/Bank/Dell/Banked Lines/dragon_tail/dragon_tail/init" = "Ти си почетен член на Драконовата стража, [Ari]. И истински приятел."
"Conversations/Bank/Dell/Banked Lines/dragonguard_armory/dragonguard_armory/1" = "Господин Марч ме научи на тази дума. Значи стая за мечове!"
"Conversations/Bank/Dell/Banked Lines/dragonguard_armory/dragonguard_armory/init" = "Здрасти, [Ari]! Добре дошли в оръжейната на Драконовата стража!"
"Conversations/Bank/Dell/Banked Lines/every_meal/every_meal/1" = "Втора вечеря, среднощна закуска, втора среднощна закуска..."
"Conversations/Bank/Dell/Banked Lines/every_meal/every_meal/init" = "Мога да ям торта на всяко хранене... закуска, обяд, вечеря, десерт..."
"Conversations/Bank/Dell/Banked Lines/evil_rain/evil_rain/init" = "Шпионите на Люк казват, че злият магьосник, който кара дъжда да вали, се крие във фонтана..."
"Conversations/Bank/Dell/Banked Lines/fountain_in_rain/fountain_in_rain/init" = "Много ми се иска да скоча във фонтана, но не искам пак да си навлека неприятности с мама... затова ще скоча, когато вали! Перфектното престъпление!"
"Conversations/Bank/Dell/Banked Lines/free_smile/free_smile/1" = "Татко ми каза да го казвам."
"Conversations/Bank/Dell/Banked Lines/free_smile/free_smile/init" = "Към всяка покупка има безплатна усмивка!"
"Conversations/Bank/Dell/Banked Lines/going_to_bed/going_to_bed/init" = "Искам да стоя будна и да играя, но мама каза, че трябва да си лягам..."
"Conversations/Bank/Dell/Banked Lines/greeting_ari/greeting_ari/1" = "Знаеш ли, онова място е обитавано от духове..."
"Conversations/Bank/Dell/Banked Lines/greeting_ari/greeting_ari/2" = "И то от чудовища! Видях едно да се крие зад едно дърво!"
"Conversations/Bank/Dell/Banked Lines/greeting_ari/greeting_ari/3" = "Кажи ми, ако ти създават проблеми, и аз ще се погрижа за тях."
"Conversations/Bank/Dell/Banked Lines/greeting_ari/greeting_ari/init" = "Здрасти! Ти ли ще се нанесеш в старата ферма? Аз съм Дел!"
"Conversations/Bank/Dell/Banked Lines/helping_register/helping_register/init" = "Здрасти, [Ari]! Помагам!"
"Conversations/Bank/Dell/Banked Lines/hungry_and_sleepy/hungry_and_sleepy/init" = "Възрастните все казват колко ни върви, че можем да играем цял ден, но играта е тежка работа! Гладна съм и ми се спи!"
"Conversations/Bank/Dell/Banked Lines/i_want_candy/i_want_candy/init" = "Искам бонбони за вечеря... Може, нали?"
"Conversations/Bank/Dell/Banked Lines/i_want_to_do_quests/i_want_to_do_quests/init" = "Нямам търпение да порасна достатъчно, за да изпълнявам задачи от таблото... Ще настъпи нова ера за Драконовата стража!"
"Conversations/Bank/Dell/Banked Lines/impressed_by_sword/impressed_by_sword/init" = "Хей! Наистина ли лейди Аделайн ти даде меч? Това е СУПЕР ЯКО!"
"Conversations/Bank/Dell/Banked Lines/lucs_bugs/lucs_bugs/init" = "Люк е нашият експерт по насекомите! Чудя се дали може да обучи буболечките си да станат шпионската мрежа на Драконовата стража..."
"Conversations/Bank/Dell/Banked Lines/mermaid/mermaid/1" = "О, чакай, не... и другата половина е риба."
"Conversations/Bank/Dell/Banked Lines/mermaid/mermaid/init" = "Мейпъл, Люк, насам! Вижте! Русалка!"
"Conversations/Bank/Dell/Banked Lines/more_snacks/more_snacks/1" = "На Драконовата стража ѝ трябват провизии за приключения."
"Conversations/Bank/Dell/Banked Lines/more_snacks/more_snacks/init" = "Тази сутрин помолих мама да ми сложи допълнително храна!"
