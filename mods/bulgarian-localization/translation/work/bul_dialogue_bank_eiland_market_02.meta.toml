"Conversations/Bank/Eiland/Market Lines/market_wheedle_2/market_wheedle_2/init" = "Уийдъл все се опитва да ми продаде идеята Музеят да организира пешеходни обиколки на Мистрия, за да привличаме туристи... но непрекъснато украсява истината."
"Conversations/Bank/Eiland/Market Lines/market_wheedle_3/market_wheedle_3/1" = "Срам ме е да призная, но му повярвах и прекарах доста време в опити да възстановя родословието му."
