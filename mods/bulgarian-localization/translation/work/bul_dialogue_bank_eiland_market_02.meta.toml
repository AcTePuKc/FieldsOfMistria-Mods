"Conversations/Bank/Eiland/Market Lines/market_wheedle_1/market_wheedle_1/2" = "И при това много лоша рисунка, [Ari]. Мисля, че сам я е нарисувал!"
"Conversations/Bank/Eiland/Market Lines/market_wheedle_1/market_wheedle_1/init" = "Уийдъл каза, че има рядък артефакт от епохата на Вещите кралици, а после накара мен и Джунипър да се наддаваме за него..."
"Conversations/Bank/Eiland/Market Lines/market_wheedle_2/market_wheedle_2/1" = "Най-вече като добавяше дракони. Докато приключи с представянето си, в Мистрия вече живееха тридесет и седем дракона!"
