"Conversations/Bank/Eiland/Market Lines/market_wheedle_3/market_wheedle_3/init" = "Веднъж Уийдъл дойде при мен с твърдението, че е отдавна изгубен принц на Алдария."
"Conversations/Bank/Eiland/Market Lines/market_wheedle_4/market_wheedle_4/1" = "После проверих и не открих никакви сведения за народ, наречен Лековерците."
"Conversations/Bank/Eiland/Market Lines/market_wheedle_4/market_wheedle_4/2" = "Когато казах това на Уийдъл, той отвърна, че сигурно аз съм техен потомък!"
"Conversations/Bank/Eiland/Market Lines/market_wheedle_4/market_wheedle_4/init" = "Уийдъл ми продаде рядък съд, уж от древната цивилизация на Лековерците."
