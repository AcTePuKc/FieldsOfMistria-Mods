"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/sleepy_0/1" = "Може би по-късно ще успеем да се промъкнем за една дрямка заедно."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/sleepy_0/init" = "И на теб ли ти се спи толкова, колкото на мен днес?"
