"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spouse_plans_0/init" = "Днес има толкова много за вършене! Май най-много очаквам каталогизирането на артефактите, винаги ми носи такова удовлетворение."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spring_evening_0/1" = "Всичко расте толкова бързо!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spring_evening_0/init" = "Няма да повярваш колко плевене има в Западните руини през пролетта."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spring_evening_1/1" = "Всички винаги са още по-весели!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spring_evening_1/init" = "Пролетта в Мистрия не е ли прекрасна?"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spring_morning_0/1" = "Забавно е как книгите по археология почти не споменават колко внимателно бърсане на прах изисква тази професия."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spring_morning_0/init" = "Ерол реши, че Музеят има нужда от едно добро пролетно почистване."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spring_morning_1/1" = "Нямам търпение!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/spring_morning_1/init" = "Пролетното време е най-доброто за работа на мястото за разкопки."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/summer_evening_0/1" = "Есента няма да дойде достатъчно скоро!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/summer_evening_0/init" = "Днес Музеят беше като парник."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/summer_evening_1/1" = "Трябва скоро да отидем заедно и да потърсим какво е изхвърлило морето на брега."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/summer_evening_1/init" = "Толкова се радвам, че в Мистрия има плаж. А ти?"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/summer_morning_0/1" = "Боя се, че Луи пак ме убеди да сложим твърде много брокат, а сега умирам от жега."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/summer_morning_0/init" = "Май трябва да поговоря с Луи за летен тоалет от по-лека материя."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/summer_morning_1/1" = "Аз определено бих хапнал сладолед. А ти?"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/summer_morning_1/init" = "Най-хубавото на лятото е, че ако ти трябва нещо сладко, за да се „разхладиш“, никой не ти се чуди!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/winter_evening_0/1" = "Трябва да се свърши, но е толкова много!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/winter_evening_0/init" = "Изглежда зимата е сезонът за наваксване с документацията на Музея..."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/winter_evening_1/1" = "Този сезон има някои доста смели модни решения. Може би ще си взема едно-две."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/winter_evening_1/init" = "Пристигна новият каталог за зимни наметала от Гилдията на шивачите."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/winter_morning_0/1" = "Е, предполагам, че може да почака до пролетта."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/winter_morning_0/init" = "Иска ми се малко работа на терен, но този сняг..."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/marriage_daily_dialogue/winter_morning_1/1" = "Но това не е чак толкова лошо. Значи ще ни трябват повече лакомства, за да се преборим със студа!"
