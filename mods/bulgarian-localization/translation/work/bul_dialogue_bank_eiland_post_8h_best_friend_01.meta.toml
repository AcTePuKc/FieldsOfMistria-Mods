[asset_properties]
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_0/1" = "Повечето следобеди прекарвах в библиотеката на майка ми, изучавайки история и древни езици. Беше чудесен начин да пътувам до далечни места!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_0/2" = "Всъщност едва когато намерих онзи калдосиански пръстен с печат, започнах да ценя историята, която през цялото време е била около мен."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_0/3" = "Сега съм благодарен на по-младото си аз, че е стигнало до археологията по такъв заобиколен път!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_0/init" = "Като дете не прекарвах толкова време навън, колкото сега."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_2/1" = "Най-новата мода при десертите пристигна... черен пипер върху сладолед!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_2/2" = "Солта е едно, но пипер? Абсурдно е."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_2/3" = "Както и да е, просто трябва да го опитам възможно най-скоро."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_2/4" = "Може да го опитаме заедно!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_2/init" = "<he>Чу ли</he><she>Чу ли</she><they>Чухте ли</they> голямата новина от Столицата, [Ari]?"

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_4/1" = "Не би ли било чудно да <he>живееш</he><she>живееш</she><they>живеете</they> в епохата на алдите? Или във времето на Вещите кралици?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_4/2" = "Но съм сигурен, че някой ден хората ще гледат и на най-обикновените неща от нашето ежедневие и ще ги смятат за удивителни."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_4/3" = "И разбира се... <he>ти живееш</he><she>ти живееш</she><they>вие живеете</they> в тази епоха!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_4/4" = "Няма как да пропусна това!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_4/init" = "<he>Чудиш ли се понякога какво би било, ако животът ти</he><she>Чудиш ли се понякога какво би било, ако животът ти</she><they>Чудите ли се понякога какво би било, ако животът ви</they> беше започнал в друга епоха?"

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_5/1" = "<he>Нека ти взема едно! После ще ми разкажеш как е минал денят ти.</he><she>Нека ти взема едно! После ще ми разкажеш как е минал денят ти.</she><they>Нека ви взема едно! После ще ми разкажете как е минал денят ви.</they>"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_5/2" = "<he>Заповядай</he><she>Заповядай</she><they>Заповядайте</they>, халба от най-доброто в Хана! Наздраве!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_5/init" = "А, [Ari]! Тъкмо си мислех, че ще е хубаво да пийнем по нещо заедно."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_6/1" = "Разгледайте спокойно различните крила на нашето учреждение, където ще откриете местни чудеса и богатата история на Мистрия..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_6/2" = "Голяма част от тази колекция е събрана почти еднолично благодарение на [Ari], член на Историческото дружество и неизменна част от местните приключения!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_6/3" = "Е? Как <he>ти</he><she>ти</she><they>ви</they> звучи сценарият ми за обиколката дотук? Според мен началото е силно!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_6/init" = "Кхъм. Добре дошли, уважаеми гости, в световноизвестния Музей за история и култура на Мистрия!"
