"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/5/prompts/0" = "Наказаха ли те?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/5/prompts/1" = "Какво направи Аделайн, когато те хвана?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/6" = "О, не. Баща ми така и не разбра."
