"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/8" = "Но ме накара да обещая, че никога повече няма да опитвам..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/9" = "И две седмици трябваше да върша и нейните задължения."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/10" = "Е, изнесе ми доста подробна лекция за правните последици от тежката кражба на кон."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/11" = "Но за щастие баща ми така и не разбра. Аделайн никога не би ме издала."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/12" = "Но ме накара да обещая, че никога повече няма да опитвам..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/13" = "И две седмици трябваше да върша и нейните задължения."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_7/init" = "Изглежда Мейпъл, Люк и Дел винаги успяват да забъркат някоя беля."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/1" = "Само си представи колко повече щяхме да знаем днес, ако предците ни бяха използвали по-трайни материали за архивите си."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/2" = "Иска ми се просто да бяха записвали всички документи върху плочи от изпечена глина."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/2/prompts/0" = "Ужасно несъобразително от тяхна страна!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/2/prompts/1" = "Но Айленд... ти пишеш всичките си ръкописи на хартия."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/3" = "Да, ужасно! Все едно изобщо не са мислели за нуждите на бъдещите археолози, когато са записвали писмата си!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/4" = "Всъщност, като се замисля..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/5" = "Може би трябва да започна да преписвам всички полеви бележки върху глина...?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/6" = "А! Добра забележка."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/7" = "Може би трябва да започна да преписвам всички полеви бележки върху глина...?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_8/init" = "Въздъх. Боли ме да мисля колко много ръкописи са били изгубени през вековете заради влага и разпад..."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_10/1" = "Поне с подобно ниво на ентусиазъм."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_10/2" = "Благодарен съм, че Ерол винаги е подкрепял интереса ми към историята..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_10/3" = "Но никога не ми е било толкова лесно да създавам близки връзки, както на Аделайн."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_10/4" = "Това, което се опитвам да кажа, е..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_10/5" = "Винаги ще ценя това, че споделяш толкова много от увлеченията ми!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_10/6" = "Никога няма да го приемам за даденост, [Ari]!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_10/init" = "Напоследък си мисля колко рядко е да намериш човек, който споделя точно моите интереси."
