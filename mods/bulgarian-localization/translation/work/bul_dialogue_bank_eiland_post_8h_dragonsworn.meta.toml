"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_best_friend/eiland_post_8h_best_friend_1/5_eog" = "Вече знаем, че доспехите осигуряват физическа защита на $Драконовия заклетник$, който на свой ред защитава Мистрия."
