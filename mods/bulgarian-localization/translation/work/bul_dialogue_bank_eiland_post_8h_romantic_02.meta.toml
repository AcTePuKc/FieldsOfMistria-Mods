"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_2/init" = "Сред уменията, които трябваше да усвоя като благородник, никога не съм смятал красноречието си за слаба страна."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/1" = "О, [Ari]!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/2" = "Извинявай, бях се замислил."
