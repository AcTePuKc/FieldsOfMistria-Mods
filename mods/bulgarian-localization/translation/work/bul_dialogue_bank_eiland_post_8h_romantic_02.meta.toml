"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_2/1" = "Тогава защо оставам без думи всеки път, когато <he>се приближиш</he><she>се приближиш</she><they>се приближите</they>?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_2/init" = "Сред уменията, които трябваше да усвоя като благородник, никога не съм смятал красноречието си за слаба страна."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/1" = "О, [Ari]!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/2" = "<he>Извинявай</he><she>Извинявай</she><they>Извинявайте</they>, бях се замислил."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/2/prompts/0" = "За какво мислиш?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/2/prompts/1" = "Всичко наред ли е?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/3" = "А, да. Просто..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/4" = "Напоследък все повече мисля за бъдещето."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/5" = "Винаги съм знаел, че Аделайн ще бъде наследницата на родителите ни."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/6" = "И винаги съм бил благодарен за това."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/7" = "Но когато <he>знаеш, че бъдещето ти зависи почти изцяло от това, което сам си изградиш</he><she>знаеш, че бъдещето ти зависи почти изцяло от това, което сама си изградиш</she><they>знаете, че бъдещето ви зависи почти изцяло от това, което сами си изградите</they>..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/8" = "Как <he>се чувстваш</he><she>се чувстваш</she><they>се чувствате</they> по този въпрос?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/8/prompts/0" = "Радвам се, че можеш свободно да следваш мечтите си!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/8/prompts/1" = "Няма значение. За мен ти си принц, Ейланд."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/9" = "[Ari]... толкова се радвам, че <he>ме разбираш</he><she>ме разбираш</she><they>ме разбирате</they>."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/10" = "Аделайн наследи много отговорности като бъдеща баронеса, докато на мен ми беше дадена свободата да вървя през живота със собствено темпо."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/11" = "Надявам се някой ден, ако имам свои деца..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/12" = "И те да имат същата свобода да следват мечтите си."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/13" = "Ха-ха!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/14" = "О, [Ari]... благодаря <he>ти</he><she>ти</she><they>ви</they>."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/15" = "Но те уверявам, че съм твърде назад в реда на наследяване, за да имам истински шанс някога да стана принц!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_3/init" = "..."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_4/1" = "Това е подарък <he>за теб</he><she>за теб</she><they>за вас</they> от „Калинката“, пекарната на семейството на Райс!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_4/2" = "Реших, че <he>може да ти хареса да опиташ</he><she>може да ти хареса да опиташ</she><they>може да ви хареса да опитате</they> техния специалитет, =Златен чийзкейк=."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_4/3" = "<he>Хапни го</he><she>Хапни го</she><they>Хапнете го</they>, докато е още пресен."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_4/init" = "<he>Ето те и теб</he><she>Ето те и теб</she><they>Ето ви и вас</they>, [Ari]! Току-що получих една изключително спешна пратка от Столицата..."
