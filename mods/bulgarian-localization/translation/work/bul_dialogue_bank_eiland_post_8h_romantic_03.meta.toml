"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_5/1" = "Като дете бях длъжен да уча придворен етикет, затова от малък се научих да свиря."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_5/2" = "За съжаление, напоследък не се упражнявам толкова, колкото би трябвало..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_5/3" = "Но ако искаш малък рецитал, нямам нищо против да се изложа мъничко пред теб."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_5/init" = "Свирил ли съм ти някога на пиано, [Ari]?"

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_6/1" = "Но днес вятърът ти придава направо зашеметяващ вид, [Ari]."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_6/init" = "Може би е от слънцето на Мистрия и морския въздух..."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_7/1" = "Балор ми каза за нов шоколатиер в Столицата, затова поръчах кутия от така желаната им първа партида..."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_7/2" = "Искам да ги споделя с теб."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_7/init" = "[Ari]! Взех ти нещо."

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_8/1" = "Ще си починеш ли малко с мен? Да хапнем нещо?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_8/2" = "Направени са тази сутрин. Вземи това, изглежда най-голямо!"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_8/init" = "[Ari]! Не можеше да дойдеш в по-подходящ момент!"

"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_9/1" = "Чудя се какво ли е усещането за $Царицата на нощта$ - да вложи цялата си енергия в един-единствен величествен миг, а после отново да заспи?"
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_9/2" = "Точно това ми харесва в съхраняването на историята. Позволява ни да погледнем назад и да оценим колко мимолетен е животът."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_9/3" = "Като... този миг тук с теб. Надявам се и ти да го запомниш."
"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_9/init" = "Казват, че $Царицата на нощта$ цъфти само веднъж годишно, за една-единствена нощ."
