"Conversations/Bank/Eiland/Relationship Lines/Relationship/post_8h_lines_romantic/eiland_post_8h_romantic_12/2" = "Но разбирам защо идеята за съдбата може да се стори малко... задушаваща. Как <he>мислиш ти, [Ari]?</he><she>мислиш ти, [Ari]?</she><they>мислите вие, [Ari]?</they>"
