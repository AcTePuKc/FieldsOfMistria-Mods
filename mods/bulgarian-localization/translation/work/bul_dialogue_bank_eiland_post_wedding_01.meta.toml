"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_1/4" = "<he>Много мило от твоя страна. Ще ти кажа</he><she>Много мило от твоя страна. Ще ти кажа</she><they>Много мило от ваша страна. Ще ви кажа</they>."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_1/init" = "Колкото повече разглеждам [farm_name], толкова повече ме очарова това място."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_2/1" = "[Ari], може ли да ме... <he>почешеш</he><she>почешеш</she><they>почешете</they> по главата? Доста помага."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_2/1/prompts/0" = "Разбира се, скъпи."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_2/1/prompts/1" = "Добре, но следващия път не прекалявай!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_2/2" = "Ах, блаженство. Голям късметлия съм."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_2/3" = "Определено си научих урока!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_2/4" = "Благодаря <he>ти</he><she>ти</she><they>ви</they>, [Ari]."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_2/init" = "Боли ме глава... Май вчера прекалих със сладкото."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_3/1" = "Последния път един човек поиска крило да носи името му и шейсет процента от приходите от билети."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_3/2" = "Когато му обясних, че Музеят е безплатен, той остана доста... недоволен."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_3/3" = "Дано този поне разбира стойността на историята!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_3/init" = "Елси иска да ме запознае с един свой благороден приятел, който желае да направи финансово дарение на Музея."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_4/1" = "Макар да са получили благороднически титли, родителите ми са се оженили по любов. Като дете чувах тази история толкова често, че бързо ми омръзна, но..."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_4/2" = "Някъде по пътя явно съм разбрал, че и аз искам да се оженя по любов."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_4/3" = "Толкова се радвам, че животът ни събра точно тогава, [Ari]."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_4/init" = "Забавно е да се връщам назад и да виждам по колко начини родителите ми са ме оформили..."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_5/1" = "Не знам какво съм си мислел. Изобщо не ми отива."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_5/2" = "Какво да го правя <he>според теб</he><she>според теб</she><they>според вас</they>?"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_5/init" = "Преди месеци поръчах нещо от Луи и той най-сетне го завърши."
