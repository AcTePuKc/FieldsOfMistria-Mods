"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_0/3/prompts/0" = "Обичам те, Ейланд."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_0/3/prompts/1" = "Щастието ми няма граници!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_0/4" = "И аз те обичам, [Ari]."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_0/5" = "И аз се чувствам така."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_0/init" = "Добро утро, [Ari]."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_1/1" = "Работата <he>ти</he><she>ти</she><they>ви</they> тук е невероятна, [Ari]."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_1/1/prompts/0" = "Благодаря! Отне ми много работа."
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_1/1/prompts/1" = "Само ми кажи, ако искаш да добавя нещо!"
"Conversations/Bank/Eiland/Relationship Lines/Marriage/post_wedding_lines/marriage_1/2" = "И си личи! Отлична работа."
