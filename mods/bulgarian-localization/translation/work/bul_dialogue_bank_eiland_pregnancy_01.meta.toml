"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_1/7" = "Това наистина звучи освежаващо."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_1/8" = "Заповядай, [Ari]. Ще се погрижа да имаме запас и вкъщи."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_1/init" = "В последното писмо от родителите ми споменаха, че когато очакваш бебе, често ти се дояждат определени храни."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_2/1" = "Надявам се да нямаш нищо против, но поговорих с Вален. И двамата сме съгласни, че няма нужда просто да стискаш зъби и да търпиш!"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_2/2" = "Според нея този сироп ще помогне и на теб, и на бебето да се чувствате чудесно."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_2/init" = "[Ari], забелязах, че сутрините ти са по-тежки, откакто очакваме бебе..."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/1" = "Н-наистина? Вече?"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/2" = "Кажи ми, ако има нещо, с което мога да ти помогна."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/3" = "Каквото и да е!"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/4" = "Наистина ли? Не мога да кажа, че съм забелязал."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/5" = "За наш късмет Луи е на разположение. Ако избереш кои дрехи искаш да бъдат отпуснати, ще му ги предам следващия път, когато е в града."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/6" = "Твоето удобство е най-важно!"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/7" = "Много се радвам."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/8" = "Непременно ми кажи, ако имаш нужда от нещо, добре?"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/init" = "Как се чувстваш днес, [Ari]?"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/init/prompts/0" = "Имам чувството, че бебето става все по-голямо!"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/init/prompts/1" = "Имам чувството, че дрехите ми стават все по-тесни!"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_3/init/prompts/2" = "Чувствам се добре!"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_4/1" = "Т-това...!"
