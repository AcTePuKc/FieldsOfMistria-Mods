"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_1/1/prompts/1" = "Много ми се хапва парче Шоколадова торта!"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_1/1/prompts/2" = "Чаша Мляко би била чудесна."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_1/2" = "Ах, идеалното допълнение към всяко ястие."
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_1/3" = "По-рано взех пресен хляб от Хана, заповядай."
