"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_4/init" = "Какво има, [Ari]? Искаш да сложа ръка на корема ти?"
"Conversations/Bank/Eiland/Relationship Lines/Child/pregnancy/ari_pregnant_5/1" = "Веднъж правих генеалогично проучване на семейството и най-ранният човек, когото открих, се е казвал Астрид преди стотици години."
