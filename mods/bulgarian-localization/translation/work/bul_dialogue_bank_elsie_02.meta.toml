[asset_properties]
"Conversations/Bank/Elsie/Banked Lines/greeting_ari/greeting_ari/1" = "[Ari]? Хубаво име."
"Conversations/Bank/Elsie/Banked Lines/greeting_ari/greeting_ari/2" = "Аз съм Елси. Живея в Имението с племенницата и племенника си, Аделайн и Айленд."
"Conversations/Bank/Elsie/Banked Lines/greeting_ari/greeting_ari/3" = "Родителите им, $Баронът$ и $Баронесата$, прекарват по-голямата част от времето си в Столицата, особено напоследък."
"Conversations/Bank/Elsie/Banked Lines/greeting_ari/greeting_ari/4" = "И аз някога живеех там. Ах, какви времена! Но като прекараш малко време в Мистрия, започваш истински да цениш живота на село."
"Conversations/Bank/Elsie/Banked Lines/greeting_ari/greeting_ari/5" = "Непременно наминавай да си побъбрим, мило дете. Мога да споделя последните $клюки$ и дори някой $любовен съвет$, ако ти потрябва."
"Conversations/Bank/Elsie/Banked Lines/greeting_ari/greeting_ari/init" = "О, я виж ти, кого си имаме тук?"
"Conversations/Bank/Elsie/Banked Lines/hemlock_and_jo_are_great/hemlock_and_jo_are_great/init" = "Хемлок и Жозефин... тези двамата са като две части от пъзел, които си пасват идеално. Радва ми се сърцето, като ги гледам."
"Conversations/Bank/Elsie/Banked Lines/hope_juni_is_there/hope_juni_is_there/init" = "Нямам търпение да се накисна хубаво в Банята. Дано Джуни е там."
"Conversations/Bank/Elsie/Banked Lines/inn_breakfast/inn_breakfast/init" = "Нищо в Столицата не може да се мери със специалната закуска на Рейна! Вкусотия!"
"Conversations/Bank/Elsie/Banked Lines/inn_is_best/inn_is_best/init" = "Нищо не повдига духа така, както малко вино и сладки приказки!"
"Conversations/Bank/Elsie/Banked Lines/inn_will_be_fun_tonight/inn_will_be_fun_tonight/init" = "Ще е приятно да видя хората от града в Хана довечера... дано успея да отида."
"Conversations/Bank/Elsie/Banked Lines/journaling_memories/journaling_memories/1" = "„Романсът на принца и шивача“ беше истински хит в Столицата. Преди няколко години играх кралица Селия! Всяка вечер ни изпращаха с овации на крака."
"Conversations/Bank/Elsie/Banked Lines/journaling_memories/journaling_memories/init" = "[Ari], тъкмо си записвах в дневника за любимите си опери."
"Conversations/Bank/Elsie/Banked Lines/juniper_effort/juniper_effort/1" = "В началото собственичката може да ти се стори малко... необщителна."
"Conversations/Bank/Elsie/Banked Lines/juniper_effort/juniper_effort/2" = "Но съм забелязала, че Джунипър се отпуска, ако се постараеш малко да я предразположиш."
"Conversations/Bank/Elsie/Banked Lines/juniper_effort/juniper_effort/3" = "Особено ако това старание включва чаша-две вино!"
"Conversations/Bank/Elsie/Banked Lines/juniper_effort/juniper_effort/init" = "Ходи ли вече до $Банята$, [Ari]?"
"Conversations/Bank/Elsie/Banked Lines/known_eiland/known_eiland/1" = "Истинска радост беше да го гледам как израства толкова добре!"
"Conversations/Bank/Elsie/Banked Lines/known_eiland/known_eiland/init" = "Познавам Айленд още отпреди да може да наднича над клавишите на пианото."
"Conversations/Bank/Elsie/Banked Lines/letter_from_court/letter_from_court/init" = "[Ari]! Току-що пристигна писмо от приятелка в Столицата и вече знам всички последни клюки от двора!"
"Conversations/Bank/Elsie/Banked Lines/manor_garden_beautiful/manor_garden_beautiful/1" = "Само между нас, Селин сама предложи да се грижи за градината на Имението и се справя чудесно!"
"Conversations/Bank/Elsie/Banked Lines/manor_garden_beautiful/manor_garden_beautiful/init" = "Понякога една следобедна разходка в градината е точно каквото трябва! Колко е красиво тук."
"Conversations/Bank/Elsie/Banked Lines/march/march/init" = "Този Марч е истински огън, нали? Но повярвай ми - повече шум, отколкото заплаха."
"Conversations/Bank/Elsie/Banked Lines/memoirs/memoirs/1" = "Колко много начини има да опишеш едно изчервяване!"
"Conversations/Bank/Elsie/Banked Lines/memoirs/memoirs/init" = "Работя по мемоарите си."
