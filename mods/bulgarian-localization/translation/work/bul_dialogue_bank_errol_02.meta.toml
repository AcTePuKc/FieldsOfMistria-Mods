"Conversations/Bank/Errol/Banked Lines/new_from_ruins/new_from_ruins/init" = "Напоследък не съм откривал нищо ново в Западните руини, но може би младият Айленд е имал повече късмет."
"Conversations/Bank/Errol/Banked Lines/new_items/new_items/init" = "[Ari], непременно ми кажи, ако попаднеш на някакви необичайни артефакти. Винаги търсим начин да разширим колекцията!"
"Conversations/Bank/Errol/Banked Lines/not_seeing_everything/not_seeing_everything/init" = "Има нещо в тези руини. Знам, че пропускам нещо. Нещо прави ли ти впечатление, [Ari]?"
"Conversations/Bank/Errol/Banked Lines/not_seeing_everything/not_seeing_everything_alt/1" = "И все пак... имам чувството, че още много неща чакат да бъдат открити."
"Conversations/Bank/Errol/Banked Lines/not_seeing_everything/not_seeing_everything_alt/init" = "Научихме толкова много нови неща за тези руини, откакто Серидия дойде в града."
