[asset_properties]
"Conversations/Bank/Errol/Market Lines/market_darcy_1/market_darcy_1/init" = "Кафето на Дарси е нещо специално. Цял живот го пиех черно, но после тя ме запозна с магията на =Латето=!"
"Conversations/Bank/Errol/Market Lines/market_darcy_2/market_darcy_2/init" = "Само момент, [Ari]... май поръчката ми при Дарси е готова!"
"Conversations/Bank/Errol/Market Lines/market_darcy_3/market_darcy_3/init" = "Случвало ли ти се е да опиташ някое от =Латетата= на Дарси? Всеки път рисува нещо различно в пяната... днес ми се падна чайка!"
"Conversations/Bank/Errol/Market Lines/market_darcy_4/market_darcy_4/init" = "Не искам да ти влияя прекалено, но ако още се чудиш какво да вземеш от Дарси... скромно препоръчвам =Мока=."
"Conversations/Bank/Errol/Market Lines/market_louis_1/market_louis_1/1" = "Сега, когато съм куратор, мога да нося костюми всеки ден! Много е приятно."
"Conversations/Bank/Errol/Market Lines/market_louis_1/market_louis_1/init" = "Когато работех в Мините, не можех да нося хубави дрехи... плащаха ми достатъчно добре, но каквото и да облека, накрая го съсипвах."
"Conversations/Bank/Errol/Market Lines/market_louis_2/market_louis_2/1" = "Той дори успява да побере тези мои рамене в смокинг, ако можеш да повярваш."
"Conversations/Bank/Errol/Market Lines/market_louis_2/market_louis_2/init" = "Не мога да препоръчам достатъчно костюмите по мярка на Луи..."
"Conversations/Bank/Errol/Market Lines/market_louis_3/market_louis_3/init" = "Първото нещо, което направих, след като Айленд ме назначи за куратор на Музея, беше да си поръчам чисто нови дрехи от Луи."
"Conversations/Bank/Errol/Market Lines/market_louis_4/market_louis_4/init" = "Обичам веднъж годишно да си поръчвам нов костюм от Луи."
"Conversations/Bank/Errol/Market Lines/market_merri_1/market_merri_1/init" = "Изключително широката ми рамка за легло е от сергията на Мери... за нея отиде втората ми заплата като куратор и определено си заслужаваше. На тези рамене им трябва място!"
"Conversations/Bank/Errol/Market Lines/market_merri_2/market_merri_2/init" = "Използвам стар миньорски сандък за разни дреболии, а Мери беше така добра да го реставрира и довърши. Никога не съм го мислел за мебел, но сега е хубав спомен."
"Conversations/Bank/Errol/Market Lines/market_merri_3/market_merri_3/init" = "Ландън е твърде горд, за да купува мебели от Мери, но от време на време съм го виждал да заглежда някой нов скрин. Поне Райс взе онази библиотека, която имат горе."
"Conversations/Bank/Errol/Market Lines/market_merri_4/market_merri_4/init" = "Жозефин сигурно сама поддържа бизнеса на Мери... поне половината Хан е обзаведен с нейни реставрирани мебели."
"Conversations/Bank/Errol/Market Lines/market_stillwell_1/market_stillwell_1/init" = "Стилуел ми каза, че ме очакват велики открития, а после намерих изгубените си ключове в другия джоб... този младеж притежава огромна сила."
"Conversations/Bank/Errol/Market Lines/market_stillwell_2/market_stillwell_2/init" = "За любовно предсказание никога не е късно! Дали ще успееш да разбереш загадъчното мънкане на Стилуел, е отделен въпрос..."
"Conversations/Bank/Errol/Market Lines/market_stillwell_3/market_stillwell_3/init" = "Стилуел ми каза, че най-хубавите ми дни тепърва предстоят... това ми стопля сърцето, [Ari]. Никога не съм мечтал дори да стана куратор, а мисълта, че има още... нямам търпение!"
"Conversations/Bank/Errol/Market Lines/market_stillwell_4/market_stillwell_4/init" = "В старите текстове за древните империи има разкази за пророци, но не вярвах в такива неща, докато не срещнах Стилуел."
