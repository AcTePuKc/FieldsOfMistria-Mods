"Conversations/Bank/Hemlock/Market Lines/market_taliferro/market_taliferro_2/1" = "Но в една истинска кухня няма шанс да издържи... ще се пречупи за нула време!"
"Conversations/Bank/Hemlock/Market Lines/market_taliferro/market_taliferro_2/init" = "Талиферо много ги разбира приказките, когато води своето $Предизвикателство в готвенето$..."
"Conversations/Bank/Hemlock/Market Lines/market_taliferro/market_taliferro_3/1" = "Готви първокласно, ама характерът му? Не, това е от ония хора, дето им трябва ресторант със собственото име на табелата."
"Conversations/Bank/Hemlock/Market Lines/market_taliferro/market_taliferro_3/init" = "Не можеш да наемеш човек като Талиферо в една обикновена кухня."
"Conversations/Bank/Hemlock/Market Lines/market_taliferro/market_taliferro_4/1" = "Но един ден тя ще е тази, която раздава похвалите. Запомни ми думите!"
"Conversations/Bank/Hemlock/Market Lines/market_taliferro/market_taliferro_4/init" = "Гордея се с Рейна, че готвач като Талиферо е оценил уменията ѝ..."
"Conversations/Bank/Hemlock/Market Lines/market_vera_1/market_vera_1/init" = "Мейпъл все говори, че иска да си боядиса косата розова. Децата трябва да могат да се изразяват, ама не знам..."
"Conversations/Bank/Hemlock/Market Lines/market_vera_2/market_vera_2/init" = "Вера и Джози са приятелки от години и винаги си намират повод да наваксат с приказките. Едно ходене на фризьор е толкова добър повод, колкото всеки друг!"
"Conversations/Bank/Hemlock/Market Lines/market_vera_3/market_vera_3/init" = "Джози каза, че обмисля да си боядиса косата лилава... според мен ще ѝ стои страхотно."
"Conversations/Bank/Hemlock/Market Lines/market_vera_4/market_vera_4/init" = "Навремето, когато обикалях с групата, за известно време косата ми беше лилава... може пак да я боядисам, колкото да си припомня старите времена."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_1/market_wheedle_1/1" = "Последно чух, че са му отнели търговския лиценз, задето продал на Кралската стража скъпа каса =Бяло вино=."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_1/market_wheedle_1/2" = "Беше чудесна реколта... ако обичаш оцет."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_1/market_wheedle_1/init" = "Изненадан съм, че Нора е позволила на Уийдъл да се намести на Съботния пазар."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_2/market_wheedle_2/1" = "Имаше и онзи път, когато отвори сергия в Столицата, на която продаваше само домати."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_2/market_wheedle_2/2" = "Наричаше ги Драконови домати, защото били люспести като дракон..."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_2/market_wheedle_2/3" = "Поне докато на голямото откриване не заваля. Цялата зелена боя се отми право в канавката, а с нея и репутацията на Уийдъл."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_2/market_wheedle_2/init" = "Всеки път, когато видя Уийдъл, се сещам за някоя от старите му бизнес далавери..."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_3/market_wheedle_3/init" = "Казах си, че няма да купувам нищо от Уийдъл, но мисля, че Джози може да хареса онова $Снежно кълбо$..."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_4/market_wheedle_4/1" = "Трудно се забравя тип в лъскав костюм от три части, който се представя като „Грийдъл“."
"Conversations/Bank/Hemlock/Market Lines/market_wheedle_4/market_wheedle_4/init" = "Имам чувството, че докато обикаляхме с групата, съм срещал Уийдъл поне десетина пъти, само че всеки път се представяше с различно име."
"Conversations/Bank/Hemlock/Market Lines/market_zorel_1/market_zorel_1/1" = "С баща ѝ се познаваме отдавна. Свиреше на саксофон като никой друг."
"Conversations/Bank/Hemlock/Market Lines/market_zorel_1/market_zorel_1/init" = "Непременно поздрави Зорел, [Ari]! Тя е стара приятелка на семейството."
