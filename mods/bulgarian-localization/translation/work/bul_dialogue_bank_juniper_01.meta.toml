"Conversations/Bank/Juniper/Banked Lines/balor_gets_me_supplies/balor_gets_me_witchvine/init" = "Балор е единственият човек в града, който може да ми намери сушен корен от вещерска лоза, но отказва да каже откъде го взема. Дразнещо!"
"Conversations/Bank/Juniper/Banked Lines/basement/basement_1/init" = "А, здравей."
"Conversations/Bank/Juniper/Banked Lines/bath_awaits/bath_awaits/1" = "Така че <he>решавай</he><she>решавай</she><they>решавайте</they> или вече <he>си тръгвай</he><she>си тръгвай</she><they>си тръгвайте</they>."
"Conversations/Bank/Juniper/Banked Lines/bath_awaits/bath_awaits/init" = "Банята те чака! Аз обаче - не."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_feeling_empty/bathhouse_feeling_empty/init" = "Банята беше малко празна, след като Елси и лейди Аделайн си тръгнаха... не че изобщо ме притеснява!"
"Conversations/Bank/Juniper/Banked Lines/bathhouse_living_is_great/bathhouse_living_is_great/init" = "Да живееш в Банята си има предимства, особено в дни като този."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_warm/bathhouse_warm/init" = "Топлината от баните държи сградата приятно топла през цялата година. Хубаво, нали?"
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work/1" = "Може би най-сетне ще си взема онази нова кристална топка, която набелязах..."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work/init" = "През зимата Банята е пълна с хора, което значи, че Тесерите се трупат доста бързо."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_10/1" = "Благодаря на себе си."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_10/init" = "Предполагам, че трябва да съм благодарна, че през зимата бизнесът върви добре."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_11/init" = "Най-голямата трагедия в това да седя зад това бюро цял ден е, че не мога да си показвам ботушите."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_12/1" = "Ъх."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_12/init" = "Ще съм във възторг, когато дойде пролетта. Студът не ме притеснява, но през зимата Банята е пълна и това значи, че трябва... нали знаеш... да работя."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_13/1" = "Ще трябва да говоря със Селин, ако искам да правя още екстракти..."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_13/init" = "Хм, свършило ли ми е вече лавандуловото масло?"
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_14/1" = "Практика, разбира се."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_14/init" = "Сигурно се чудиш как успявам да пазя наметалото си сухо, докато работя в Банята?"
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_2/1" = "Идеален момент да изпробвам нови масла за баня и билкови смеси."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_2/init" = "През зимата Банята винаги е пълна..."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_3/init" = "Банята те чака. След като си платиш, разбира се."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_4/1" = "Не че ми пука или нещо такова."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_4/init" = "Ако някой стои прекалено дълго във ваната, пращам Доузи да го провери."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_5/init" = "За баня ли си? Тесерите на плота, банята е вдясно. Знаеш как става."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_6/1" = "Първия месец след откриването приличах на стафида."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_6/2" = "Секси стафида, разбира се."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_6/init" = "Проблемът да управляваш Баня е, че можеш да си вземеш вана, когато си поискаш."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_7/1" = "Сигурна съм, че ще му хареса, ако <he>я пробваш</he><she>я пробваш</she><they>я пробвате</they>."
"Conversations/Bank/Juniper/Banked Lines/bathhouse_work/bathhouse_work_7/init" = "Доузи се е справил добре с днешната смес за баня, [Ari]."
