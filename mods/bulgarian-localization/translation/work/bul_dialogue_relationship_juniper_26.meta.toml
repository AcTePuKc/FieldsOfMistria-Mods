"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_0/2" = "И съвсем малко по-добра компания за разговор."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_0/init" = "<he>Знаеш ли</he><she>Знаеш ли</she><they>Знаете ли</they>... когато дойдох тук за първи път, мислех, че най-интересното нещо в това малко селце ще са магическите линии."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_1/1" = "Ако не беше Доузи, не съм сигурна, че изобщо щях да <he>ти обърна внимание</he><she>ти обърна внимание</she><they>ви обърна внимание</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_1/2" = "За мой късмет... той има отлична преценка за хората."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_1/init" = "Напоследък си мисля за началото, когато се запознахме."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_2/1" = "<he>Ще ми кажеш</he><she>Ще ми кажеш</she><they>Ще ми кажете</they>, ако някой <he>те тормози</he><she>те тормози</she><they>ви тормози</they>, нали?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_2/2" = "Защото тогава ще имам пълното право да го залича от лицето на земята."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_2/init" = "Ей..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_3/1" = "Обмислях няколко възможни експеримента."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_3/2" = "Какво ли ще стане, ако съчетаем наследената ми магия с твоята магия на есенцията...?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_3/3" = "Заедно със сигурност бихме могли да забъркаме някоя беля."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_3/init" = "Ооо, надявах се да <he>се отбиеш</he><she>се отбиеш</she><they>се отбиете</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_4/1" = "Има нещо, което отдавна се каня да <he>ти кажа</he><she>ти кажа</she><they>ви кажа</they>..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_4/2" = "<he>Ъм. Извинявай за онзи път, когато те превърнах в кон.</he><she>Ъм. Извинявай за онзи път, когато те превърнах в кон.</she><they>Ъм. Извинете за онзи път, когато ви превърнах в кон.</they>"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_4/init" = "Ей, [Ari]."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_5/1" = "Предполагам, защото <he>ти си ми по-забавен</he><she>ти си ми по-забавна</she><they>вие сте ми по-забавни</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_5/init" = "Доузи казва, че напоследък прекарвам по-малко време в гледане в кристалната си топка..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_6/1" = "<he>Е, ако си търсиш съучастник... знаеш къде да ме намериш.</he><she>Е, ако си търсиш съучастник... знаеш къде да ме намериш.</she><they>Е, ако си търсите съучастник... знаете къде да ме намерите.</they>"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_6/init" = "Този поглед... познавам го. Нещо <he>си намислил</he><she>си намислила</she><they>сте намислили</they>."
