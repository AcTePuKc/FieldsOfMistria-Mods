[asset_properties]
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/1" = "Елси ме посъветва от време на време да питам <he>как си</he><she>как си</she><they>как сте</they> и как върви фермата."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/2" = "И така. Как върви фермата? Как е цялата тази... пръст? А... червеите? Всичко ли е... задоволително?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/2/prompts/0" = "Червеите са си чудесно."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/2/prompts/1" = "Мило е от твоя страна, но не се насилвай."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/3" = "И... това е хубаво? Чудесно!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/4" = "Чудесно..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/5" = "<he>Слушай! Нищичко не разбирам от земеделие, но... радва ме да виждам как успяваш</he><she>Слушай! Нищичко не разбирам от земеделие, но... радва ме да виждам как успяваш</she><they>Слушайте! Нищичко не разбирам от земеделие, но... радва ме да виждам как успявате</they>!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/6" = "И това е важното!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/7" = "Ох, слава богу."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/8" = "<he>Слушай. Нищичко не разбирам от земеделие, но... радва ме да виждам как успяваш</he><she>Слушай. Нищичко не разбирам от земеделие, но... радва ме да виждам как успяваш</she><they>Слушайте. Нищичко не разбирам от земеделие, но... радва ме да виждам как успявате</they>! И това е важното!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_0/init" = "Кхъм..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/1" = "<he>Не би ли предпочел да бъдеш всемогъщ магьосник, вместо обикновен фермер</he><she>Не би ли предпочела да бъдеш всемогъща магьосница, вместо обикновена фермерка</she><they>Не бихте ли предпочели да бъдете всемогъщи магьосници, вместо обикновени фермери</they>?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/1/prompts/0" = "Ами ти и твоята Баня?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/1/prompts/1" = "Фермерството е само първата стъпка по пътя към невъобразима сила!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/2" = "Хммм. Май <he>имаш право</he><she>имаш право</she><they>имате право</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/3" = "В началото беше просто средство за по-големите ми амбиции, но... с времето я заобичах."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/4" = "<he>Предполагам, че при теб с фермерството е същото</he><she>Предполагам, че при теб с фермерството е същото</she><they>Предполагам, че при вас с фермерството е същото</they>, а?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/5" = "О-хо, ясно."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/6" = "Може би и аз трябва някой път да опитам..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_1/init" = "С такава сила е трудно да повярвам, че <he>прекарваш толкова време да ровиш</he><she>прекарваш толкова време да ровиш</she><they>прекарвате толкова време да ровите</they> в пръстта..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/1" = "От известно време се каня да <he>те разпитам</he><she>те разпитам</she><they>ви разпитам</they> повече за Мините."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/2" = "Професионалното ми любопитство надделя. Как е долу?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/2/prompts/0" = "Нищо особено - руда, скъпоценни камъни и чудовища, наситени с есенция..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/2/prompts/1" = "Май постоянно виждам някакъв призрак?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/3" = "Нищо... особено?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/4" = "<he>Шегуваш ли се</he><she>Шегуваш ли се</she><they>Шегувате ли се</they>? Това звучи невероятно!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/5" = "Е, ако някога <he>поискаш да си разменим силите за един ден</he><she>поискаш да си разменим силите за един ден</she><they>поискате да си разменим силите за един ден</they>..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/6" = "Нямам нищо против сама да сляза и да видя."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/7" = "..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/8" = "<he>Мислиш, че ще се хвана на това</he><she>Мислиш, че ще се хвана на това</she><they>Мислите, че ще се хвана на това</they>? П-призраци не съществуват, [Ari]!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/9" = "Но, ъм... радвам се, че <he>ти се занимаваш с проучването</he><she>ти се занимаваш с проучването</she><they>вие се занимавате с проучването</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_2/init" = "Ей, <he>не си зает</he><she>не си заета</she><they>не сте заети</they>, нали? Разбира се, че не."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_3/1" = "<he>Диплома? По сладурство? Не говори глупости</he><she>Диплома? По сладурство? Не говори глупости</she><they>Диплома? По сладурство? Не говорете глупости</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_3/2" = "Макар че имаше допълнителна специалност по бизнес."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_3/3" = "Така е. Доузи е много важен за мен."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_3/4" = "И е особено важно да си го припомням, когато ме сложи на сутрешна смяна."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_3/init" = "<he>Разказвала ли съм ти как се запознахме с Доузи</he><she>Разказвала ли съм ти как се запознахме с Доузи</she><they>Разказвала ли съм ви как се запознахме с Доузи</they>? Всъщност беше в колежа."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_3/init/prompts/0" = "Хаха, ясно. Обзалагам се, че е завършил сладурство."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_best_friend/juniper_post_8h_best_friend_question_3/init/prompts/1" = "Толкова дълго приятелство сигурно е нещо специално!"
