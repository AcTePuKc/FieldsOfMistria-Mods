"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_0/1" = "Първо, все още трябва да плащаш за баните в Банята."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_0/2" = "Второ, докато работя, трябва да се държиш особено мило с мен."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_0/3" = "И трето... трябва да ме държиш за ръка."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_0/4" = "А-ако искаш."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_0/init" = "[Ari]! Тъкмо размишлявах върху промяната в отношенията ни и искам да изясним няколко неща."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_1/1" = "Например „Чудя се как е [Ari]“ и „Чудя се дали [Ari] се храни достатъчно“."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_1/2" = "Със сигурност е страничен ефект от заклинанието, което <he>ми направи</he><she>ми направи</she><they>ми направихте</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_1/init" = "Напоследък ме спохождат някакви обезпокоителни мисли..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_2/1" = "А сега <he>ме хвани за ръка</he><she>ме хвани за ръка</she><they>ме хванете за ръка</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_2/2" = "Да, точно така."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_2/3" = "..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_2/4" = "Добре, стига толкова! Няма нужда да ставаме чак толкова прилепчиви."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_2/init" = "Добре, че си тук."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_3/1" = "Но не <he>мислиш ли</he><she>мислиш ли</she><they>мислите ли</they>, че е малко лекомислено да използваш магията си, за да станеш още по-привлекателен?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_3/2" = "Не че <he>имаш нужда</he><she>имаш нужда</she><they>имате нужда</they> от нея."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_3/3" = "Какво? <he>Ти... не използваш магия</he><she>Ти... не използваш магия</she><they>Вие... не използвате магия</they>?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_3/4" = "О."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_3/init" = "Сега, [Ari]... <he>можеш да правиш каквото пожелаеш</he><she>можеш да правиш каквото пожелаеш</she><they>можете да правите каквото пожелаете</they>..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_4/1" = "Аз имам моята магия, а <he>ти - твоята</he><she>ти - твоята</she><they>вие - вашата</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_4/2" = "Чудя се какво ли би станало, ако двете се преплетат?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_4/init" = "[Ari], замислих се..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_5/1" = "В... чисто професионалния смисъл, в който мисля за всички редовни посетители на заведението си!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_5/2" = "Докато съм на работа, <he>няма да получаваш никакво специално отношение</he><she>няма да получаваш никакво специално отношение</she><they>няма да получавате никакво специално отношение</they> от мен."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_5/3" = "Очевидно."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_5/init" = "О! Тъкмо си мислех за <he>теб</he><she>теб</she><they>вас</they>, [Ari]."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_6/1" = "Да споделям подобен интерес с други хора беше... приятно."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_6/2" = "Напоследък отново изпитвам това чувство."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_6/3" = "Какво? Защо <he>ме гледаш така</he><she>ме гледаш така</she><they>ме гледате така</they>?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_6/4" = "Стига с това самодоволно изражение. Марш!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_6/init" = "Когато учех в колежа, бях заобиколена от хора, които изучаваха магия."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_7/1" = "Аз, ъм... направих нещо за <he>теб</he><she>теб</she><they>вас</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_7/2" = "Не е нужно да го <he>ядеш, ако не ти харесва</he><she>ядеш, ако не ти харесва</she><they>ядете, ако не ви харесва</they>..."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_7/3" = "Но да не <he>си посмял да го изхвърлиш</he><she>си посмяла да го изхвърлиш</she><they>сте посмели да го изхвърлите</they>!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_7/init" = "А, ето <he>те</he><she>те</she><they>ви</they>."
