[asset_properties]
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_0/1" = "Добре ли е умът <he>ти</he><she>ти</she><they>ви</they>? А тялото?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_0/1/prompts/0" = "Умът ми...? Трябва ли да се притеснявам, Джунипър?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_0/1/prompts/1" = "Тялото ми...? Нещо ли <he>си намислила</he><she>си намислила</she><they>сте намислили</they>, Джунипър?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_0/2" = "Н-не! Просто исках да попитам как <he>си</he><she>си</she><they>сте</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_0/3" = "Така ли не се прави?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_0/4" = "Стига си се хилил така! Марш!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_0/init" = "Здравей, [Ari]."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/1" = "И всичко е по <he>твоя вина</he><she>твоя вина</she><they>ваша вина</they>!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/1/prompts/0" = "Какво имаш предвид?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/1/prompts/1" = "Защото си мечтаеш за... мен?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/2" = "Е, обикновено си мечтая как ставам могъща магьосница-"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/3" = "и после се връщам да натрия носовете на старите си състуденти."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/4" = "Но сега си представям как се появявам и с <he>теб под ръка</he><she>теб под ръка</she><they>вас под ръка</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/5" = "Представяш ли си? Можем да придадем съвсем нов смисъл на израза „силна двойка“."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/6" = "Е... в известен смисъл."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/7" = "Обикновено си мечтая как ставам могъща магьосница-"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_1/init" = "Знаеш ли... напоследък мечтите ми са малко по-различни."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/1" = "Честно казано, ужасно се срамувах, че <he>ме видя така</he><she>ме видя така</she><they>ме видяхте така</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/2" = "Какво ли щеше да <he>си помислиш за мен</he><she>си помислиш за мен</she><they>си помислите за мен</they>, ако заклинанието <he>ти</he><she>ти</she><they>ви</they> не ме беше върнало към нормалното...?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/2/prompts/0" = "Честно казано, животинските шарки ти отиват."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/2/prompts/1" = "Всъщност май ми хареса."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/3" = "О-хо-хо-хо!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/4" = "Като го кажеш така... не звучи чак толкова зле."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/5" = "Радвам се, че това нямаше да <he>те изплаши и прогони</he><she>те изплаши и прогони</she><they>ви изплаши и прогони</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/6" = "Наистина ли...?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/7" = "С-стига си се шегувал, [Ari]!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/8" = "Но... радвам се, че това нямаше да <he>те изплаши и прогони</he><she>те изплаши и прогони</she><they>ви изплаши и прогони</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_2/init" = "Хммм. Тъкмо си мислех за онзи злополучен случай с... люспите."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_3/1" = "[Ari]! Бързо! Кое е първото цвете, което <he>ти идва наум, когато мислиш за мен</he><she>ти идва наум, когато мислиш за мен</she><they>ви идва наум, когато мислите за мен</they>?"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_3/1/prompts/0" = "Кристална роза!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_3/1/prompts/1" = "Сенчесто цвете!"
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_3/2" = "Хммм... Мистична, чувствена и подчертано бодлива."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_3/3" = "Май... не <he>грешиш</he><she>грешиш</she><they>грешите</they>."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_3/4" = "Хммм... Красива, загадъчна и издръжлива."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_3/5" = "Добър избор."
"Conversations/Bank/Juniper/Relationship Lines/Relationship/post_8h_lines_romantic/juniper_post_8h_romantic_question_3/init" = "Трябва ми вдъхновение за нов отличителен аромат за Банята..."
