# First farm introduction cutscene
"Cutscenes/Story Events/farm_introduction/farm_introduction/init" = "А... здравей! Ти сигурно си [Ari]. Аз съм Селин, приятно ми е да се запознаем!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/1" = "Изглежда, че ще бъдем съседи! Затова ти донесох малък подарък за новия дом... ъъ, за новото поле."
"Cutscenes/Story Events/farm_introduction/farm_introduction/2" = "Ето ти $мотика$ — ще ти трябва, за да $разореш полето си$! И аз обичам да се занимавам с градинарство, затова имах една в повече."
"Cutscenes/Story Events/farm_introduction/farm_introduction/3" = "Ако искаш да $разшириш полето си$, ще ти трябва $лопата$. Можеш да я купиш от $Смесения магазин$ на семейството ми."
"Cutscenes/Story Events/farm_introduction/farm_introduction/4" = "А ето ти и 3 торбички със $семена от лалета$, с които да започнеш! В магазина ни има и други $семена$, така че непременно ни навести."
"Cutscenes/Story Events/farm_introduction/farm_introduction/5" = "Надявам се да отглеждаш много цветя!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/5/prompts/0" = "Благодаря, обожавам цветята!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/5/prompts/1" = "Аз повече си падам по картофите..."
"Cutscenes/Story Events/farm_introduction/farm_introduction/6" = "Еха, много се радвам! Знаеш ли, Мистрия има богата история в отглеждането на растения —"
"Cutscenes/Story Events/farm_introduction/farm_introduction/7" = "Знаеше ли, че картофените растения също цъфтят? Ще разбереш, че са готови за прибиране, когато цветовете им разцъфнат —"
"Cutscenes/Story Events/farm_introduction/farm_introduction/8" = "Добро утро, <he>съседе</he><she>съседке</she><they>съседе</they>! Казвам се Хейдън и ръководя $Ферма Сладка вода$ на запад. Няма нужда да ми казваш името си, [Ari] — вече всички в града говорят за теб!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/9" = "Хейдън! За малко да връхлетиш право върху <he>горкия</he><she>горката</she><they>горките</they> [Ari]!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/10" = "Ха, не му се сърди. Конят ми също обича да се запознава с нови хора!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/11" = "ХА ХА ХА!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/11/prompts/0" = "Няма нищо. За мен е удоволствие!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/11/prompts/1" = "Май трябва да полегна..."
"Cutscenes/Story Events/farm_introduction/farm_introduction/12" = "Фермер по душа! Ето, донесох ти нещо дребно!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/13" = "Е, добре... Извинявай. Ето, нека да се реванширам."
"Cutscenes/Story Events/farm_introduction/farm_introduction/14" = "Вземи тази $лейка$! Ще трябва да $поливаш културите си всеки ден$, ако искаш да пораснат големи и здрави."
"Cutscenes/Story Events/farm_introduction/farm_introduction/15" = "А ето ти и 3 торбички със $семена от ряпа$! Ряпата е вкусна сурова, а сготвена е още по-добра!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/16" = "Целият град със сигурност ще се радва на още доставки на пресни продукти."
"Cutscenes/Story Events/farm_introduction/farm_introduction/17" = "Отдавна не съм идвал насам — всичко е доста обрасло... Имаш ли нужда от съвети как да започнеш с полето си, [Ari]?"
"Cutscenes/Story Events/farm_introduction/farm_introduction/17/prompts/0" = "С удоволствие ще послушам съветите ти!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/17/prompts/1" = "Благодаря, но вече знам как се работи във ферма..."
"Cutscenes/Story Events/farm_introduction/farm_introduction/19" = "Еха, значи вече си <he>правил</he><she>правила</she><they>правили</they> това! Чудесно!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/20" = "Не се притеснявай, [Ari], минавай по всяко време, ако искаш да си поговорим. Ще се радвам да те запозная с всичките си животни!"
"Cutscenes/Story Events/farm_introduction/farm_introduction/21" = "Сигурно нямаш търпение да се срещнеш с Аделайн. Тръгни $на север оттук$ и пътят ще те отведе право в $града$!"
