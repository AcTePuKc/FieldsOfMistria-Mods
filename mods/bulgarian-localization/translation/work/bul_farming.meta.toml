[asset_properties]
"ui/tutorials/farming/steps/0/text" = "Стъпка 1:\nС мотиката разори\nразчистената почва."
"ui/tutorials/farming/steps/1/text" = "Стъпка 2:\nПосади семената в\nразораната почва."
"ui/tutorials/farming/steps/2/text" = "Стъпка 3:\nПоливай всеки ден,\nдокато пораснат."
"ui/tutorials/farming/steps/3/text" = "Стъпка 4:\nПрибери реколтата!"
"ui/tutorials/farming/steps/4/text" = "Вземи лопата от Смесения магазин,\nза да разшириш полето си."
"ui/tutorials/farming/steps/5/text" = "Продай, сготви или нахрани\nживотните с културите!"
