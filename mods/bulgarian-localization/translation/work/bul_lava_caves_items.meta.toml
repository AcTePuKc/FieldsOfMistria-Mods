[meta_properties]
id = "fom-bg-work-lava-caves-items"
asset_kind = "Translation"

[asset_properties]
"items/mines/lava_caves/armored_bass/name" = "Брониран лаврак"
"items/mines/lava_caves/armored_bass/description" = "Обичайна средна риба от Лавовите пещери. Този вид лаврак е развил невероятно дебели, металически на вид люспи."
"items/mines/lava_caves/ash_mushroom/name" = "Пепелна гъба"
"items/mines/lava_caves/ash_mushroom/description" = "Нежна гъба, която отделя подобни на пепел спори, когато я разклатиш."
"items/mines/lava_caves/breath_of_fire/name" = "Дъхът на пламъка"
"items/mines/lava_caves/breath_of_fire/description" = "Тези красиви цветя продължават да светят дори след като бъдат откъснати."
"items/mines/lava_caves/candelabra_seadragon/name" = "Морски дракон канделабър"
"items/mines/lava_caves/candelabra_seadragon/description" = "Необичайна малка риба от Лавовите пещери. Тънките ѝ израстъци я карат да прилича на канделабър."
"items/mines/lava_caves/cooktop_beetle/name" = "Бръмбар котлон"
"items/mines/lava_caves/cooktop_beetle/description" = "Обичайно насекомо от Лавовите пещери. Горната част на черупката му е достатъчно гореща, за да изпържиш яйце."
"items/mines/lava_caves/diamond_beetle/name" = "Диамантен бръмбар"
"items/mines/lava_caves/diamond_beetle/description" = "Рядко насекомо от Лавовите пещери. Този чуден бръмбар има непробиваема защита... освен ако не го вдигнеш."
"items/mines/lava_caves/fire_crystal/name" = "Огнен кристал"
"items/mines/lava_caves/fire_crystal/description" = "Обичаен артефакт от Лавовите пещери. Този кристал е пропит със същността на огъня."
"items/mines/lava_caves/fire_wasp/name" = "Огнена оса"
"items/mines/lava_caves/fire_wasp/description" = "Обичайно насекомо от Лавовите пещери. За щастие тази оса изглежда опасна само за други насекоми."
"items/mines/lava_caves/firesail_fish/name" = "Огненоплатник"
"items/mines/lava_caves/firesail_fish/description" = "Рядка голяма риба от Лавовите пещери, която живее в лава. Устройството на тялото ѝ е пълна загадка."
"items/mines/lava_caves/flame_pepper/name" = "Огнена чушка"
"items/mines/lava_caves/flame_pepper/description" = "С тези невероятно люти чушки трябва да се борави внимателно."
"items/mines/lava_caves/hot_potato/name" = "Горещ картоф"
"items/mines/lava_caves/hot_potato/description" = "Тези предварително изпечени диви картофи имат пикантен вкус, който изненадващо пристрастява."
"items/mines/lava_caves/lava_chestnuts/name" = "Лавови кестени"
"items/mines/lava_caves/lava_chestnuts/description" = "Тези вкусни кестени идват вече изпечени!"
"items/mines/lava_caves/lava_piranha/name" = "Лавова пираня"
"items/mines/lava_caves/lava_piranha/description" = "Обичайна малка риба от Лавовите пещери. И видът, и поведението ѝ са еднакво стряскащи."
"items/mines/lava_caves/lava_snail/name" = "Лавов охлюв"
"items/mines/lava_caves/lava_snail/description" = "Необичайно насекомо от Лавовите пещери. Този охлюв оставя след себе си мънички разтопени следи."
"items/mines/lava_caves/obsidian/name" = "Обсидиан"
"items/mines/lava_caves/obsidian/description" = "Отломка от вулканично стъкло."
"items/mines/lava_caves/rainbow_geode/name" = "Дъгова геода"
"items/mines/lava_caves/rainbow_geode/description" = "Необичаен артефакт от Лавовите пещери. Тази невероятна геода е от много различни скъпоценни камъни, слети заедно."
"items/mines/lava_caves/red_obsidian/name" = "Червен обсидиан"
"items/mines/lava_caves/red_obsidian/description" = "Необичаен артефакт от Лавовите пещери. През този къс обсидиан минава червена ивица."
"items/mines/lava_caves/smoke_moth/name" = "Димна пеперуда"
"items/mines/lava_caves/smoke_moth/description" = "Необичайно насекомо от Лавовите пещери. Създава малък облак дим около себе си, за да се пази от хищници."
"items/mines/lava_caves/sulfur_crab/name" = "Сярен рак"
"items/mines/lava_caves/sulfur_crab/description" = "Необичаен среден ракообразен от Лавовите пещери. Черупката му е покрита с дебел жълт слой сяра."
"items/mines/lava_caves/tiny_volcano/name" = "Малък вулкан"
"items/mines/lava_caves/tiny_volcano/description" = "Рядък артефакт от Лавовите пещери. Тази геоложка формация прилича много на вулкан, само че... малък."
"items/mines/lava_caves/warm_rock/name" = "Топъл камък"
"items/mines/lava_caves/warm_rock/description" = "Обичаен артефакт от Лавовите пещери. Камъкът изглежда обикновен, но винаги остава топъл на допир."
