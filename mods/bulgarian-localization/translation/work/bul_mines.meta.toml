[asset_properties]
"ui/tutorials/mines/steps/0/text" = "В Мините ще намираш\nматериали, растения, риби,\nнасекоми и съкровища!"
"ui/tutorials/mines/steps/1/text" = "Разбивай скалите на етажа,\nза да намериш стълба надолу."
"ui/tutorials/mines/steps/2/text" = "Не забравяй, че можеш да скачаш\nи да плуваш, докато изследваш!"
