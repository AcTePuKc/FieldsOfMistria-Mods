"ui/tutorials/mines/steps/4/text" = "Внимавай: магията е превърнала\nпредмети в чудовища!"
"ui/tutorials/mines/steps/5/text" = "Подобрявай меча и бронята,\nза да напредваш по-лесно."
"ui/tutorials/mines/steps/6/text" = "Статуята при входа продава\nумения за копаене и битка\nс натрупаната есенция."
"ui/tutorials/mines/title" = "Урок: Мините"
