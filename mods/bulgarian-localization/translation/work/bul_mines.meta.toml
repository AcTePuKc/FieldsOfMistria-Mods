[asset_properties]
"ui/tutorials/mines/steps/0/text" = "Изследването на Мините е чудесен начин\nда откриеш нови материали, растения, риби,\nнасекоми и дори съкровища!"
"ui/tutorials/mines/steps/1/text" = "Разбивай скалите на всеки етаж, за да\nнамериш стълба, която ще ти позволи да\nпродължиш надолу."
"ui/tutorials/mines/steps/2/text" = "Не забравяй, че можеш да скачаш\nи да плуваш, докато изследваш!"
"ui/tutorials/mines/steps/3/text" = "На всеки 5 етажа ще отключваш\nасансьорна платформа, с която можеш\nбързо да стигаш от входа на Мините."
"ui/tutorials/mines/steps/4/text" = "Внимавай, магията, проникнала в\nтози свят, е превърнала неодушевени\nпредмети в чудовища!"
"ui/tutorials/mines/steps/5/text" = "Подобряването на меча и бронята ти\nще ти помогне, докато напредваш."
"ui/tutorials/mines/steps/6/text" = "Статуята при входа може да се използва и\nза закупуване на полезни умения за копаене и\nбитка с натрупаната есенция."
"ui/tutorials/mines/title" = "Урок: Мините"
