[meta_properties]
id = "fom-bg-work-ruins-items"
asset_kind = "Translation"

[asset_properties]
"items/mines/ruins/ancient_firefly/name" = "Древна светулка"
"items/mines/ruins/ancient_firefly/description" = "Обичайно насекомо от Руините. Тази древна светулка почти прилича на фея."
"items/mines/ruins/chirping_fern/name" = "Чуруликаща папрат"
"items/mines/ruins/chirping_fern/description" = "Папрат, която от време на време издава приятно чуруликане по незнайни причини и по незнаен начин."
"items/mines/ruins/coelacanth/name" = "Целакант"
"items/mines/ruins/coelacanth/description" = "Рядка голяма риба от Руините. Изглежда е тук от много, много дълго време..."
"items/mines/ruins/dragon_claw/name" = "Драконов нокът"
"items/mines/ruins/dragon_claw/description" = "Необичаен артефакт от Руините. Изключително остър въпреки възрастта си. Би станал за чудесно острие, ако не беше толкова тежък."
"items/mines/ruins/dragon_forged_bracelet/name" = "Гривна, кована с драконов огън"
"items/mines/ruins/dragon_forged_bracelet/description" = "Рядък артефакт от Руините. Древна гривна, кована с драконов огън. Странно, изглежда по мярка за човешка китка."
"items/mines/ruins/dragon_pact_tablet/name" = "Плоча на драконовия договор"
"items/mines/ruins/dragon_pact_tablet/description" = "Легендарен артефакт от Руините. Написан на непреводим драконски език."
"items/mines/ruins/dragon_scale/name" = "Драконова люспа"
"items/mines/ruins/dragon_scale/description" = "Необичаен артефакт от Руините. Хилядите изминали години са втвърдили тази люспа до нещо по-здраво от стомана."
"items/mines/ruins/essence_blossom/name" = "Цвят на есенцията"
"items/mines/ruins/essence_blossom/description" = "Цвете, пропито с магия. Красиво и изненадващо издръжливо."
"items/mines/ruins/ethereal_grass/name" = "Неземна трева"
"items/mines/ruins/ethereal_grass/description" = "Трева с неземен произход. Използва се в някои рецепти за изработка."
"items/mines/ruins/gazer/name" = "Наблюдател"
"items/mines/ruins/gazer/description" = "Необичайна средна риба от Руините. Тази странна риба не се нуждае от очи, за да вижда."
"items/mines/ruins/giant_jellyfish/name" = "Гигантска медуза"
"items/mines/ruins/giant_jellyfish/description" = "Обичайно голямо безгръбначно от Руините. Тази величествена медуза е красива за гледане!"
"items/mines/ruins/giant_worm/name" = "Гигантски червей"
"items/mines/ruins/giant_worm/description" = "Необичайно насекомо от Руините. Преди се е смятало, че този праисторически червей е изчезнал."
"items/mines/ruins/hardened_essence/name" = "Втвърдена есенция"
"items/mines/ruins/hardened_essence/description" = "Рядък артефакт от Руините. Магическа есенция, втвърдена в подобна на скъпоценен камък форма. Светът сигурно е бил пълен с магия, когато се е образувала."
"items/mines/ruins/hidden_beetle/name" = "Скрит бръмбар"
"items/mines/ruins/hidden_beetle/description" = "Рядко насекомо от Руините. Този камуфлиращ се бръмбар трудно се забелязва сред отломките."
"items/mines/ruins/luminescent_crab/name" = "Светещ рак"
"items/mines/ruins/luminescent_crab/description" = "Обичаен среден ракообразен от Руините. Необичайното му сияние вероятно идва от мистриловите частици в утайките."
"items/mines/ruins/parchment_moth/name" = "Пергаментова пеперуда"
"items/mines/ruins/parchment_moth/description" = "Необичайно насекомо от Руините. Тази пеперуда се храни главно със стар пергамент."
"items/mines/ruins/spell_fruit/name" = "Магически плод"
"items/mines/ruins/spell_fruit/description" = "Плод с неустоим аромат, който е просто магически."
"items/mines/ruins/void_snail/name" = "Охлюв на Бездната"
"items/mines/ruins/void_snail/description" = "Обичайно насекомо от Руините. Този необичаен охлюв предпочита да живее в пълна тъмнина."
"items/mines/ruins/voidite/name" = "Безднит"
"items/mines/ruins/voidite/description" = "Отломка от безднит."
"items/mines/ruins/winged_shrimp/name" = "Крилата скарида"
"items/mines/ruins/winged_shrimp/description" = "Обичаен малък ракообразен от Руините. Тези скариди сякаш са се приспособили към суровите условия там."
"items/mines/ruins/written_root/name" = "Изписан корен"
"items/mines/ruins/written_root/description" = "Корен, който сякаш сам се подрежда в букви. Колко странно."
