[meta_properties]
id = "fom-bg-work-story-adeline-quest-board"
asset_kind = "L10nTarget"

[asset_properties]
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/init" = "Здравей, [Ari]! Надявах се да те срещна!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/1" = "Точно навреме си! Сигурно нямаш търпение да помогнеш на Мистрия и жителите ѝ, затова искам да ти разкажа за нашето $Табло за заявки$. Ела с мен!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/2" = "Както подсказва името, жителите оставят тук своите $заявки$ всеки ден. Ще получаваш награди, щом ги изпълниш!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/3" = "Чудесен начин да спечелиш $пари$, $екипировка$ и най-важното — $известност$!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/3/prompts/0" = "Известност?"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/3/prompts/1" = "Нямам търпение да започна!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/4" = "А, да, нека обясня накратко..."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/5" = "Толкова се радвам! Нека ти обясня накратко за $известността$..."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/6" = "Както знаеш, Мистрия е само един от многото градове в Кралство Алдария. Всеки получава $Ранг на града$ според $нивото си на известност$."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/7" = "Градовете с по-висок $Ранг на града$ се радват на по-голяма известност и повече подкрепа от Столицата."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/8" = "$Нивото на известност$ на Мистрия се подобряваше преди земетресението... Но след него изгубихме цели два $Ранга на града$."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/9" = "Като дъщеря и наследница на барона на Мистрия, подобряването на положението е най-важният ми приоритет."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/10" = "С твоя помощ ще поправим щетите от земетресението, ще повишим $Ранга на града$ и ще върнем Мистрия на картата!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/11" = "Сега приеми първата си $заявка$! Току-що я закачих за теб!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/12" = "Чудесно! Лесно беше, нали?"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/13" = "Сигурна съм, че искаш да се запознаеш с новите си съседи толкова, колкото и те с теб!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/14" = "А като ги опознаеш по-добре, $Дневникът$ ти ще следи отношенията ти с тях и дори ще записва любимите им подаръци."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/14/prompts/0" = "А ти какво харесваш, Аделайн?"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/14/prompts/1" = "Как мога да те накарам да ме харесаш, Аделайн?"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/15" = "Е, =лалетата= са хубави, а сега им е сезонът! Надявам се, че ще отглеждаш такива във фермата си!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/16" = "А-"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/17" = "Е, не бих отказала =лале=, [Ari]."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/18" = "Т-Така де, все още имаме много да си говорим!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/19" = "Можеш да видиш $Картата$ в $Дневника$ си. Тя ще ти помогне да разбереш къде са хората. Полезно е, нали? И ще се обновява всеки път, когато се запознаеш с някого!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/20" = "Може да го приемеш като първата крачка по пътя ни към възстановяването на града."
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board/21" = "Не е ли вълнуващо? Ела да поговорим, щом се запознаеш с всички!"
"Cutscenes/Story Events/adeline_quest_board/adeline_quest_board_follow_up/init" = "Не забравяй да проверяваш $Картата$ в $Дневника$ си — много помага да се ориентираш!"
