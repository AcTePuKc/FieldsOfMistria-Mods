[asset_properties]
"quests/story_quests/do_a_bro_a_favor/name" = "Услуга за приятел"
"quests/story_quests/do_a_bro_a_favor/description" = "<he>Нов си</he><she>Нова си</she><they>Нови сте</they> в града! Забеляза ли, че Мистрия е пълна с камъни? Имам точния инструмент за тях. Твой е, ако ми направиш една услуга!\n\nЕла да поговорим за подробностите!"
"quests/story_quests/do_a_bro_a_favor/stages/0/objective_description" = "Поговори с Олрик."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/7" = "Напоследък помагам на малкия си брат Марч в семейната ни ковачница! Той е страхотен ковач, но... ъъ... как да го кажа... не се разбира особено с хората..."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/8" = "Олрик, тук ли си? Трябва ми..."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/9" = "А? Какво правиш тук?"
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/9/prompts/0" = "Здрасти, Марч!"
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/9/prompts/1" = "Не следиш ли? Тук съм по специална молба!"
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/10" = "Хм. Забавлявай се с „приказките“ с брат ми, но гледай да не му губиш много от времето. Олрик, ела в стаята ми, като приключиш, трябва да прегледаш един чертеж."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/11" = "А? Ако да измъкнеш подарък от брат ми се води „специална молба“, не бих се хвалил с това."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/12" = "Олрик, ела в стаята ми, след като изпратиш [Ari]."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/13" = "Аха... извинявай. Той не го мисли наистина."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/14" = "Та, за моята молба... Ако можеш, дай шанс на Марч. Ще е много готино от твоя страна. Той няма много приятели."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/15" = "Ще се видим по-късно, [Ari]."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/init/prompts/0" = "Значи ти си ковачът."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor/init/prompts/1" = "Еха, доста си як."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor_followup/init" = "О? Олрик ти е казал да поговорим за $Мините$?"
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor_followup/1" = "Някога Мистрия беше известна с тях! Там имаше $минерали$ и $руди$ от всякакъв вид. Гордеех се, че бях надзирател."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor_followup/2" = "Но след земетресението всичко се промени."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor_followup/3" = "Мините пострадаха тежко и $рангът на града$ ни падна. А и... нали..."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor_followup/4" = "Ъъ... Накратко, наложи се да ги запечатам."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor_followup/5" = "Сега приоритетите ми са да развивам $Музея$ и да повишавам $ранга на града$."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor_followup/6" = "Затова не се тревожи за $Мините$, става ли? Някои неща е по-добре да оставим на мира."
"Cutscenes/Story Events/do_a_bro_a_favor/do_a_bro_a_favor_turn_in/init" = "Благодаря, че прие молбата ми, [Ari]! Сега къде ли сложих онази $кирка$..."
