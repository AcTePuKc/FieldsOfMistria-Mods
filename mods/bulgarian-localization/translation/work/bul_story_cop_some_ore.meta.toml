[asset_properties]
"quests/story_quests/cop_some_ore/name" = "Донеси малко руда"
"quests/story_quests/cop_some_ore/description" = "Пратката ми с руда закъснява, а мързеливият ми брат няма да влезе вместо мен в „осъдената, супер зловеща мина“, така че някой друг трябва да го направи!\n\nДонеси ми 3 парчета медна руда! Или недей! Все тая!"
"quests/story_quests/cop_some_ore/stages/0/objective_description" = "Донеси на Марч медна руда."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/init" = "Ето! Сега изчезвай, имам работа."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/1" = "Радвам се да чуя, че пак работиш, Марч! Значи някой е изпълнил заявката ти?"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/2" = "Лейди Аделайн! Ъъ... да, така е."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/2/prompts/0" = "Радвам се, че помогнах!"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/2/prompts/1" = "Да, аз! А Марч беше истински грубиян за това!"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/3" = "О, колко чудесно! Благодаря ти, [Ari]!"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/4" = "Хаха, Марч не е особено добър в изразяването, но съм сигурна, че е бил доволен. Нали така, Марч?"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/5" = "Благодаря, [Ari]."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/6" = "Имам идея! Като допълнителна награда, защо не дадеш на [Ari] кратък урок по $ковачество$? Не звучи ли забавно?"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/7" = "..."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/8" = "Д-добре."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/9" = "Ковачеството е занаят, който изисква време, умения и добри материали."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/10" = "С достатъчно практика всеки може да стане що-годе сносен ковач."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/11" = "Но истински майстор като мен може да отиде по-далеч и да пропие метала с нова сила! За това още е рано."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/12" = "Искаш ли да видиш $Урока по ковачество$?"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/12/prompts/0" = "Да"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/12/prompts/1" = "Не"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/15" = "Хайде, вземи я."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/16" = "Даваш я на [Ari]? Колко щедро, Марч!"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/17" = "А-"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/18" = "Д-да."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/19" = "Разбира се! Защо не!"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/20" = "Какво ти казах, [Ari]? Той всъщност е голяма мека душа. Сигурна съм, че с радост ще ти позволи да използваш тази $ковачница$, когато поискаш да се занимаваш с $ковачество$."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/21" = "Аз... аз..."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore/22" = "Добре! Имам друга работа за вършене!"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_anticipation_1/init" = "Не че трябва да се занимаваш, но Марч може да се поотпусне към теб, ако му донесеш нужната руда."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_anticipation_1/1" = "Не си личи, но оценява, когато хората се отзовават."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_anticipation_2/init" = "Отиваш в Мините за тази мед? Сега, [Ari], това е важно:"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_anticipation_2/1" = "Кажи ми, ако видиш готин камък."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_turn_in/init" = "Какво по-... ТИ изпълни заявката ми?"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_turn_in/1" = "Добре, да вземем наградата ти..."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_follow_up_1/init" = "Само между нас — наистина помогна на Марч в труден момент с тази мед. Благодаря, [Ari]!"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_follow_up_2/init" = "Не бих нарекла Марч благодарен, но ще помни похода ти до Мините за неговата мед."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_follow_up_2/1" = "Вероятно. Така мисля."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_follow_up_3/init" = "Еха, в Мините? Каква смелост, [Ari]!"
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_follow_up_4/init" = "Следващия път Дел ще те помоли да я заведеш в Мините."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_follow_up_4/1" = "В случай че попита: абсолютно не."
"Cutscenes/Story Events/cop_some_ore/cop_some_ore_follow_up_5/init" = "<he>Бил си</he><she>Била си</she><they>Били сте</they> в Мините? Вземи ме следващия път! Моля те-е-е!"
