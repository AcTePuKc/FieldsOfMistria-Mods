[asset_properties]
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/init" = "[Ari]! Добро утро!"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/1" = "Едно птиченце ми каза, че ти и [ELSIE_ROMANTIC_NPC] сте си признали чувствата... и сте започнали $да се срещате$!"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/2" = "Колко чудесно. Много се радвам за вас!"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/3" = "Надявам се, че нямаш нищо против да мина, но си помислих, че може да ти трябват няколко съвета за $срещите$, за да започнеш."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/4" = "Първото, което трябва да помниш, е, че $времето е важно$!"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/5" = "През седмицата всички са заети с работа, затова $уикендите са най-подходящото време да поканиш някого на среща$."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/6" = "И $събота$, и $неделя$ са чудесни дни за това."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/7" = "Само помни, че можеш да имаш $само по една среща седмично с всеки партньор$."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/8" = "Теоретично... $ако се срещаш с двама души$, можеш да имаш $среща$ с единия в $събота$ и с другия в $неделя$ през същата седмица."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/9" = "Не съм тук, за да те съдя, [Ari]. Единственият начин да разбереш дали някой е подходящ за теб е да прекараш повече време с този човек."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/10" = "Но имай предвид, че когато му дойде времето... $можеш да сключиш брак само с един човек$."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/11" = "Затова избирай добре."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/12" = "Я да видим, какво още..."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/13" = "О, да! Остава въпросът $къде да ходите на срещи$!"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/14" = "Понякога ще намираш $предмети с идеи за срещи$, които при използване отключват нови $видове срещи$!"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/15" = "Ето, [Ari]. Имам два $предмета с идеи за срещи$. Това би трябвало да ти стигне за начало."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/15_no_deep_woods" = "Ето, [Ari]. Имам $предмет с идея за среща$. Това би трябвало да ти стигне за начало."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/16" = "$При първата среща от нов вид с някого$ ще получиш $снимка от среща$, която ще ти напомня за случая."
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/17" = "Можеш да събираш тези $снимки от срещи$ и дори $да ги поставиш у дома си, за да ги разглеждаш по всяко време$. Не е ли забавно?"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/18" = "С малко късмет със сигурност ще намериш всякакви $предмети с идеи за срещи$, ще се насладиш на различни $срещи$ и ще събереш много сладки $снимки от срещи$!"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/19" = "Успех, [Ari]! Ще те подкрепям!"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/20" = "Искаш ли да видиш $Урока за срещите$?"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/20/prompts/0" = "Да"
"Cutscenes/Story Events/elsie_dating_tutorial/elsie_dating_tutorial/20/prompts/1" = "Не"
