[meta_properties]
id = "fom-bg-work-story-jos-cooking-class"
asset_kind = "Translation"

[asset_properties]
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/init" = "[Ari]! Тъкмо навреме си. Тъкмо започваме урока."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/1" = "Готови ли сте да научите основите на готвенето? Днес ще приготвим прочутата $зеленчукова супа$ на хана!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/1/prompts/0" = "Ммм, нямам търпение!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/1/prompts/1" = "А може ли да започнем с нещо като торта?"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/2" = "Чудесно!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/3" = "О, харесва ми този ентусиазъм! Но първо да видим как ще се справиш със супата, [Ari]!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/4" = "Балор реже зеленчуците..."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/5" = "Не мислех, че техниката ми с ножа може да стане още по-добра, но Джо наистина я бива."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/6" = "Селийн наглежда казана..."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/7" = "[Ari]! Не е ли забавно? Излиза, че тенджерата под наблюдение НАИСТИНА завира!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/8" = "А Рейна и аз сме тук, за да ви напътстваме като истински специалисти!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/9" = "Ела насам, [Ari]! Можеш да ми помогнеш да подберем зеленчуците."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/10" = "О! Ъъ... мислех, че урокът по готвене ще е насаме...?"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/11" = "Глупости, колкото повече, толкова по-весело! Влизай, Марч!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/12" = "Искаш ли да разгледаш $урока по готвене$?"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/12/prompts/0" = "Да"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/12/prompts/1" = "Не"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/15" = "Чудесна работа, всички!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/16" = "Това ще направи времето ми на път много по-поносимо! Трябваше да поискам уроци още отдавна."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/17" = "А и е чудесен начин да оползотворим остатъците. Вече ми хрумват разни неща..."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/18" = "Олрик прави цяло събитие от готвенето, а то не беше ЧАК толкова трудно."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/19" = "Толкова се гордея с всички ви! Не е лесно да научите нещо ново, но всички направихте първата си крачка в кулинарния свят."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/20" = "Ползвайте нашата $кухня$ тук, ако искате да се упражнявате! Можете да си купите и своя от $Дърводелницата$!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class/21" = "Благодаря, че дойдохте, всички!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class_follow_up_1/init" = "Справи се чудесно в урока по готвене, [Ari]! Ела по всяко време, ако искаш съвет, става ли?"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class_follow_up_2/init" = "Урокът на Джо по готвене беше точно каквото ми трябваше! Вече полевите ми дажби нямат вкус, сякаш съм ги вдигнал от пътя."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class_follow_up_3/init" = "Не беше ли забавен урокът на Джо по готвене? Тя го направи толкова лесно!"
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class_follow_up_4/init" = "Олрик беше доста впечатлен от готвенето ми, след като взех урока на Джо."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class_follow_up_4/1" = "Съвсем естествено. Скоро ще съм най-добрият ковач И най-добрият готвач в Мистрия."
"Cutscenes/Story Events/jos_cooking_class/jos_cooking_class_follow_up_5/init" = "[Ari]! Надявам се урокът ми по готвене да ти е разкрил възможностите на кулинарното изкуство!"
