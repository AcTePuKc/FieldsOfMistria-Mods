"Cutscenes/Story Events/Mines/dragon_tablet_pt_1/dragon_tablet_pt_1/25" = "Сигурна съм, че $Плочата на Драконовия заклетник$ ще разкрие следващите ти стъпки."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_1/dragon_tablet_pt_1_follow_up_seridia/init" = "Да, <he>герою</he><she>героиньо</she><they>герои</they>? Какво има?"
