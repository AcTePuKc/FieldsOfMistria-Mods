"Cutscenes/Story Events/Mines/dragon_tablet_pt_1/dragon_tablet_pt_1/13" = "Достатъчно голяма, за да започне $магията$ да се просмуква през нея..."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_1/dragon_tablet_pt_1/14" = "Тя си пробиваше път нагоре и се разпръскваше из земята."
