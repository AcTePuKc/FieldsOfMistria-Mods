"Cutscenes/Story Events/Mines/dragon_tablet_pt_1/dragon_tablet_pt_1/20" = "Не мога да понеса мисълта колко дълго би продължило това."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_1/dragon_tablet_pt_1/21" = "Но най-сетне си тук..."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_1/dragon_tablet_pt_1/22" = "$<he>Героят, когото</he><she>Героинята, която</she><they>Героите, които</they> чаках$."
