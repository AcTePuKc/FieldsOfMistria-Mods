[asset_properties]
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/init" = "Трябва ми само миг, за да преведа това."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/1" = "…"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/2" = "…"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/2/prompts/0" = "Кажи какво мислиш."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/2/prompts/1" = "Опитай се да не дишаш шумно."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/3" = "Тихо!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/4" = "…"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/5" = "Е, добре!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/6" = "Тук има изключително необичайни термини, които не съм срещала. Не мога да съм сигурна в превода."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/7" = "Каза, че пещерите под Мините са наситени с водна магия?"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/8" = "Ще ни трябва помощта на някой, който се специализира в много екзотична флора."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/8/prompts/0" = "Селин обича растенията!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/8/prompts/1" = "Доузи! Но с какво да го подкупим?"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/9" = "Радвам се, че си внимавал."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/10" = "Винаги е ТОЛКОВА приятно, когато отвориш уста."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/11" = "Сигурна съм, че си виждал Селин с глава, заровена в онзи том, Кодексът на Мистрия."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/12" = "Доколкото съм чувала, „езотеричен“ едва ли описва съдържанието му. Може да е точно това, което ни трябва!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/13" = "[Ari] и Джунипър? Каква изненада!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/14" = "Селин, идваме при теб с мисия от изключителна важност."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/15" = "О, звучи забавно. Ще сложа чайника."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/16" = "А тъкмо купих пакет от онези бисквити, които харесваш, Джунипър."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/17" = "Колко мило!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/18" = "Ъъ… Искам да кажа… Това ще ни даде време да те запознаем с всички подробности…"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/19" = "Какво невероятно място! Ще ми е интересно да видя какво расте в Приливните пещери."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/19/prompts/0" = "Разбира се, да вървим!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/19/prompts/1" = "Там долу е наистина много опасно…"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/20" = "Моля ви, съсредоточете се и двамата."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/21" = "Мисля, че ще се придържам към разглеждането на образците в Музея."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/22" = "Да видим какво казва Кодексът…"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/23" = "Подземна среда, наситена със стихийна магия… Това със сигурност стеснява търсенето."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/24" = "Има ли нещо друго, което би ни помогнало, Джунипър?"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/25" = "Вещерският език зависи много от контекста, така че правилното растение вероятно ще ми помогне да преведа останалата част от текста."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/26" = "Това е полезно!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/27" = "Мисля, че най-добрият ни избор вероятно е $нефритно водорасло$."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/28" = "Да опитаме…"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/29" = "Намери $рибата, чиято стрела лети право$;"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/30" = "Едно $бижу с цвета на синьото море$;"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/31" = "Събери $нефритно водорасло$;"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/32" = "Намери $ловеца в коралите$."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/33" = "Това определено е!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/34" = "Колко вълнуващо!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/35" = "Изглежда все още има загадка за разгадаване, нали, [Ari]?"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/35/prompts/0" = "Ще я реша за нула време!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/35/prompts/1" = "Но ако и на Музея му трябват тези неща?"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/36" = "Е, предполагам, че вече веднъж успя."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/37" = "Сигурна съм, че ще направиш очевидния и правилен избор."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/38" = "Помощта ти беше безценна, Селин. Благодаря ти."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/39" = "Винаги!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/40" = "Кажи ни, ако ти трябва още помощ, [Ari]. Нямам търпение да чуя какво ще откриеш после."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet/41" = "И елате по всяко време, и двамата! Беше забавно!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_turn_in/init" = "Намери още една плоча, още по-дълбоко под земята?"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_turn_in/1" = "Ела с мен, последното, от което имаме нужда, са зяпачи."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_follow_up_celine/init" = "Никога не бих си помислила, че Кодексът на Мистрия може да помогне за решаването на древна загадка!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_follow_up_celine/1" = "Чудя се какви други тайни крие…"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_follow_up_eiland/init" = "Джунипър ми показа претривката от втората плоча! Каква невероятна находка."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_follow_up_eiland/1" = "Да си представиш, че се е затруднила и е трябвало да поиска помощ!"
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_follow_up_juniper/init" = "Признавам, че трудността при превода на тази плоча ме смири."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_follow_up_juniper/1" = "Разбира се, без мен никога нямаше да я решиш."
"Cutscenes/Story Events/Mines/translating_the_earth_tablet/translating_the_earth_tablet_follow_up_juniper/2" = "Охо-хо-хо!"
