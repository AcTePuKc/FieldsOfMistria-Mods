"Cutscenes/Story Events/Mines/fire_seal/break_fire_seal/6" = "Побързай, [Ari]! Трябва да действаш, преди да е станало твърде късно. Щом Печатът на огъня е разбит, ти дарявам ново заклинание — $Драконов дъх$."
"Cutscenes/Story Events/Mines/fire_seal/break_fire_seal/7" = "Използвай го сега, за да унищожиш $Свитъка за запечатване$!"
"Cutscenes/Story Events/Mines/fire_seal/break_fire_seal/8" = "[Ari]...? [Ari], чуваш ли ме?"
"Cutscenes/Story Events/Mines/fire_seal/break_fire_seal/9" = "Моля те... събуди се! Трябва да използваш заклинанието!"
