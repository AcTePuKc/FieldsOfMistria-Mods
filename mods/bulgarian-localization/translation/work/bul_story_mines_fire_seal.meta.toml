"Cutscenes/Story Events/Mines/fire_seal/break_fire_seal/12" = "[Ari], издръж! Идвам да те спася!"
"Cutscenes/Story Events/Mines/fire_seal/break_fire_seal/13" = "[Ari]... Слава на боговете, че си добре."
"Cutscenes/Story Events/Mines/fire_seal/break_fire_seal/14" = "Не ми остава много сила."
"Cutscenes/Story Events/Mines/fire_seal/break_fire_seal/15" = "Трябва да се оттегля в храма си в $Дълбоката гора$... $Използвай новото си заклинание, за да разчистиш пътя$, и ела при мен там."
