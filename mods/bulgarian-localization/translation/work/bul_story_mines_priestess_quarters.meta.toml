[asset_properties]
"locations/priestess_quarters/name" = "Покоите на жрицата"
"Conversations/flavor_text/priestess_quarters_bed/init" = "Древно каменно легло."
"Conversations/flavor_text/priestess_quarters_bed/1" = "Печката с драконов огън в основата му вероятно е служила за готвене и за топлина."
"Conversations/flavor_text/priestess_quarters_bedroom_shelf_left/init" = "Украсен свитък лежи разгънат върху прашния рафт…"
"Conversations/flavor_text/priestess_quarters_bedroom_shelf_left/1" = "^„Негово благородие става все по-предпазлив с нарастването на луната.“^"
"Conversations/flavor_text/priestess_quarters_bedroom_shelf_left/2" = "^„Трябва да продължим да изпълняваме свещените ритуали въпреки събитията на повърхността.“^"
"Conversations/flavor_text/priestess_quarters_bedroom_shelf_left/3" = "^„Потокът на $магията$ засега остава стабилен.“^"
"Conversations/flavor_text/priestess_quarters_bedroom_shelf_left/4" = "^„Но се питам…“^"
"Conversations/flavor_text/priestess_quarters_bedroom_shelf_left/5" = "^„Ще успеем ли да устоим на задаващата се буря?“^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/init" = "^Привет, <he>герою</he><she>героиньо</she><they>герои</they>.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/1" = "^Пристигна в $Покоите на жрицата$.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/2" = "^Ах…^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/3" = "^Високопоставени жрици някога са живели тук.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/4" = "^Нужно е било, за да останат близо до $Портата между световете$.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/5" = "^Това, което познаваш като $„Последният печат“$.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/6" = "^Тази врата…?^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/7" = "^Не, не. $Последният печат$ е още по-надолу.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/8" = "^Но изглежда тази врата в момента препречва пътя ти надолу.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/9" = "^И… е $заключена$.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/10" = "^Не изглеждай толкова унил!^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/11" = "^Достигна свещено място. Тук няма капани.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/12" = "^$Магическият ключ$, с който се стига до долните етажи, със сигурност е скрит в тези покои.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/13" = "^Трябва да започна други приготовления…^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/14" = "^Затова ще трябва да преминеш през това изпитание без помощ.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_1/15" = "^Но съм сигурна, че скоро ще намериш $Магическия ключ$.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2/init" = "^Умно се справи, <he>герою</he><she>героиньо</she><they>герои</they>!^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2/1" = "^Знаех, че ще преминеш изпитанието.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2/2" = "^$Последният печат$ е пред теб.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2/3" = "^Позволи ми да ти дам дар, който ще улесни последното ти слизане.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2/4" = "^Използвай $Заклинанието за Свещена светлина$ върху $Тъмни етажи$, ако искаш да преминаваш през тях по-лесно.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2/5" = "^Ще се срещнем отново в дъното на Руините.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2/6" = "^Ще чакам…^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2/7" = "^И най-сетне заедно ще възстановим силата на Дракона.^"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/init" = "Въпрос? Разбира се, [Ari], какъв е?"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/1" = "Искаш да знаеш повече за $Драконовите жрици$?"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/2" = "Толкова всеотдайни души."
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/3" = "Те ми показаха… непоколебима вяра в мен."
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/4" = "…"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/5" = "Прости ми, [Ari]. Болезнено ми е да се опитвам да си спомня лицата им."
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/5/prompts/0" = "Забрави, че попитах!"
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/5/prompts/1" = "Просто се съсредоточи върху почивката."
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/6" = "Благодаря ти, [Ari]."
"Cutscenes/Story Events/Mines/priestess_quarters/priestess_quarters_pt_2_follow_up_caldarus/7" = "Може би когато спомените ми се върнат, ще ти разкажа истории за онези дни."
