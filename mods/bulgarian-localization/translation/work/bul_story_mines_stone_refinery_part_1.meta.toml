[asset_properties]
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/init" = "[Ari]! Виждам, че и Аделайн те е повикала."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/1" = "Здравей, [Ari]!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/2" = "Благодаря на всички, че дойдохте!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/3" = "С радост споделям, че Кралският съвет официално поздрави Мистрия за повишаването на $Ранга на града$ ни."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/4" = "Мистрия бързо се превръща в един от най-високо оценените райони в цяла Алдария!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/5" = "Каква чест! Не бих могла да съм по-щастлива от напредъка на малкото ни село!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/6" = "Освен това…"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/7" = "Самият крал ни предлага възможността да получим нещо, наречено $пречиствател за камъни$, доставено направо в Мистрия от Столицата!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/8" = "Уау! Двойно уау! Тройно-"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/9" = "Нека ти обясня, [Ari], Олрик. В миньорските среди се говори много за новата технология $пречиствател за камъни$ на кралството."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/10" = "Надеждни източници твърдят, че устройството раздробява и преобразува $камък$ в други полезни материали, като скъпоценни камъни и $обработен камък$!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/11" = "Ще е огромна придобивка да имаме такова забележително устройство тук!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/12" = "Сега просто трябва да намерим място за него!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/13" = "Ооо, сега разбирам защо искаше да говориш с нас!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/14" = "Разбира се, на такова устройство ще му трябва специално работно помещение. Да огледаме ли входа на Мините?"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/15" = "Като куратор на Музея бих казал, че строежът близо до тази драконова статуя не е добра идея."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/16" = "Мисля, че ей тук ще стане!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/17" = "Отдавна не съм копал. Това ще е страхотно!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/18" = "Радвам се, че си с нас, Олрик."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/19" = "Не съм специалист по такава работа, но имам няколко плана, които се надявах да обсъдя с всички вас…"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/20" = "$200 броя дърво$, $400 камък$, $20 смола$ и $5000 тесери$ би трябвало да стигнат за изграждането на помещението и доставката на $пречиствателя за камъни$ до Мистрия!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/21" = "Тези чертежи ми изглеждат много добри. Добавянето на $сандък за съхранение$ е чудесен щрих!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/21/prompts/0" = "Можеш да разчиташ на мен да събера всички материали!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/21/prompts/1" = "Нямам търпение да започна с пречистването!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/22" = "Много яко от твоя страна, [Ari]!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/23" = "Тъкмо същото си мислех!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1/24" = "Чудесно! Ще поставя $кутия за дарения$ пред Мините."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1_follow_up_eiland/init" = "Сестра ми ми разказа за $пречиствателя за камъни$! Доста вълнуващо!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1_follow_up_eiland/1" = "Попитах дали и в Столицата работят по „рафинерия за десерти“, но за жалост няма такъв късмет…"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1_follow_up_march_high_hearts/init" = "Олрик не спира да ми надува главата за този $пречиствател за камъни$."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1_follow_up_march_high_hearts/1" = "Събираш материалите, нали? Заповядай."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1_follow_up_march_high_hearts/2" = "А-аз просто искам брат ми да е щастлив."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1_follow_up_march_low_hearts/init" = "Олрик не спира да ми надува главата за този $пречиствател за камъни$."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1_follow_up_march_low_hearts/1" = "Събираш материалите, нали? Заповядай."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_1_follow_up_march_low_hearts/2" = "Не си прави грешни изводи! Просто искам брат ми да е щастлив."
