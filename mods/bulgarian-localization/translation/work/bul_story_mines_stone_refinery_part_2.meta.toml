[asset_properties]
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_turn_in/init" = "Познавам този поглед! Да позная, време е да построим работилницата за $пречиствателя за камъни$?"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_turn_in/init/prompts/0" = "Точно така!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_turn_in/init/prompts/1" = "Ауу, исках да те изненадам!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_turn_in/1" = "Колко вълнуващо!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_turn_in/2" = "Ха-ха, откакто пристигна тук, не спираш да ме изненадваш, [Ari]!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_turn_in/3" = "Да съберем останалите!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/init" = "Текущата здравина на конструкцията изглежда стабилна. Докато укрепваме тавана по пътя, мисля, че всичко ще е наред."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/1" = "Кратка и точна оценка, Олрик."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/2" = "Яко!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/3" = "Ще се дръпна назад, нали?"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/3/prompts/0" = "Да започваме!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/3/prompts/1" = "Първият намерен злато или скъпоценни камъни са мои!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/4" = "Да! Води ни, Ерол!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/5" = "Можем ли да направим това? Първите интересни камъни са мои!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/6" = "Ето, започваме!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/7" = "Ах, каква радост е да видя разширени съоръженията на Мините."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/8" = "Колко впечатляващ е този $пречиствател за камъни$! Само си представи какво можем да постигнем с него!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/9" = "Хей, мисля, че намерих някакъв артефакт!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/10" = "Или много странен камък…"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/11" = "Боже мой!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/12" = "Макар че предвид наскоро откритата драконова статуя, предполагам, че не е чак толкова неочаквано."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/13" = "Госпожице Аделайн, да уведомим ли брат ви? Подозирам, че много ще се заинтересува."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2/14" = "Разбира се! Да вървим!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_follow_up_adeline/init" = "Само в най-смелите си мечти съм си представяла, че ще имаме късмета да получим нещо като $пречиствател за камъни$ в Мистрия."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_follow_up_adeline/1" = "Явно някои мечти наистина се сбъдват!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_follow_up_eiland/init" = "Онази чаша, която откри на входа на Мините… Никога не съм виждал нещо подобно."
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_follow_up_eiland/1" = "Надявам се да проуча още и да разбера за какво е била използвана!"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_follow_up_ryis/init" = "Този $обработен камък$, който $пречиствателят за камъни$ може да прави, е доста интересен, не мислиш ли?"
"Cutscenes/Story Events/Mines/stone_refinery/stone_refinery_pt_2_follow_up_ryis/1" = "Или само на мен ми се струва така…?"
