"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/16" = "Оценявам… ентусиазма ви, но просто не мога да одобря повторното отваряне сега."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/17" = "Структурни щети, разместени рудни жили, асансьорът не работи…"
