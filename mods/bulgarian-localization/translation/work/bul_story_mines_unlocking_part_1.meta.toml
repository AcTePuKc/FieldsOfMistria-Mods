"Conversations/Bank/Caldarus/Statue Lines/cutscene_follow_up/unlocking_the_mines_pt_1_anticipation/2" = "[Ari], моля те, проучи това по-обстойно. Усещам, че то ще е ключът към разбирането на завръщането на магията в тази земя."
