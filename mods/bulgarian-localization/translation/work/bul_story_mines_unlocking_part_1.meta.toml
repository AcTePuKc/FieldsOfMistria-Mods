"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/init" = "[Ari]! Благодаря, че дойде!"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/1" = "Надявам се, че не си въвлякъл [Ari] в някоя от схемите си, Ейланд."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/1/prompts/0" = "За какво става дума?"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/1/prompts/1" = "О, харесвам добра схема."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/2" = "Смятам, че е време да обсъдим повторното отваряне на Мините."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/3" = "Тогава това ще ти хареса! Смятам, че е време да обсъдим повторното отваряне на Мините."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/4" = "Ейланд, при цялото ми уважение, смятам, че трябва да се съсредоточим върху Музея."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/5" = "Нямаме достатъчно работници, за да подновим добива в Мините."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/6" = "А Музеят вече привлича интерес чак от Столицата!"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/7" = "Смятам, че това е най-сигурният начин да повишим Известността на Мистрия и това трябва да ни е основен приоритет."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/8" = "Съгласни сме, че Музеят трябва да е приоритетът ни, Ерол."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/9" = "Но с идването на [Ari] смятам, че вече имаме идеалния човек, който да започне да проучва Мините!"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/10" = "Доставките на $руда$ биха били безценни за града, а в дълбините със сигурност чакат да бъдат открити невероятни $артефакти$."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/10/prompts/0" = "Нали Мините бяха затворени след земетресението?"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/10/prompts/1" = "Колкото по-опасно е приключението, толкова по-добре!"
