"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/13" = "…"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/14" = "Няма награда без риск, нали?"
