"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/24" = "Н-не е задължително!"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/25" = "Предаването на $предмети за музейни комплекти$, изпълнението на $поръчки$ и $изпращането$ на предмети са начини да помогнеш за повишаване на $Известността$ на Мистрия!"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/26" = "Да се заемаме. Мините ще бъдат отворени отново за нула време!"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/27" = "Радвам се да те видя толкова ентусиазиран, Ейланд."
