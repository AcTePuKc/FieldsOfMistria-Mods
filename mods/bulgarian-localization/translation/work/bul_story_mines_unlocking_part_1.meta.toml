"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/19" = "Едва ли държиш Мините затворени заради някакви зловещи шумове, Ерол."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/20" = "…"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/21" = "Ъъ… Ще се радвам да обсъдим въпроса отново, когато $Рангът на града$ на Мистрия достигне поне $Ранг Каменна звезда$, ако това ви устройва."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_1/unlocking_the_mines_pt_1/22" = "Виждам, че няма да те разубедим, Ерол."
