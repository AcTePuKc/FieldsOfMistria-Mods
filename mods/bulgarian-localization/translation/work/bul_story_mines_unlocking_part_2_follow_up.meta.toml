[asset_properties]
"Conversations/Bank/Caldarus/Statue Lines/cutscene_follow_up/unlocking_the_mines_pt_2_follow_up/1" = "Мините са отворени? Интересно…"
"Conversations/Bank/Caldarus/Statue Lines/cutscene_follow_up/unlocking_the_mines_pt_2_follow_up/2" = "Дръж ме в течение, [Ari]. Макар че усещам как силата ми бавно се връща, паметта ми все още изостава."
"Conversations/Bank/Caldarus/Statue Lines/cutscene_follow_up/unlocking_the_mines_pt_2_follow_up/init" = "Усещаш ли промяна във въздуха? Изглежда потокът на магията се е усилил."
"Conversations/Bank/Caldarus/Statue Lines/cutscene_follow_up/unlocking_the_mines_pt_2_follow_up_2/1" = "Добре ще е да проучиш Мините внимателно. Подозирам, че с навлизането в дълбочина ще откриеш много ценни неща."
"Conversations/Bank/Caldarus/Statue Lines/cutscene_follow_up/unlocking_the_mines_pt_2_follow_up_2/init" = "<he>Усещаш неудържим порив да поговориш</he><she>Усещаш неудържим порив да поговориш</she><they>Усещате неудържим порив да поговорите</they> със статуята на Калдаръс."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_adeline/1" = "О, но това означава ли, че отново ще имаме сигурен източник на руда? Едва се справяхме само с връзките на Балор."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_adeline/init" = "Мините пак са отворени? Моля те, внимавай там долу!"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_balor/1" = "Кажи ми, ако попаднеш на скъпоценни или други ценни камъни…"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_balor/init" = "Този дявол Ейланд! Значи е успял да отвори Мините?"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_eiland/1" = "И ми кажи, ако долу има нещо, което си заслужава да бъде проучено!"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_eiland/init" = "Толкова съм развълнуван, че изследваш Мините, [Ari]. Наистина внимавай."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_errol/init" = "Сгрява старото ми сърце да видя Мините отново отворени, макар и временно."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_march/1" = "Май в теб има повече, отколкото си мислех."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_march/init" = "Влезе в Мините и излезе невредим?"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_olric/1" = "Обичам да работя с Марч в ковачницата, но ми липсва да троша камъни."
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_olric/2" = "Потроши малко камъни и вместо мен, става ли?"
"Cutscenes/Story Events/Mines/unlocking_the_mines_pt_2/unlocking_the_mines_pt_2_follow_up_olric/init" = "Чух за експедицията ти в Мините, [Ari]! Страхотно!"
"letters/unlocking_the_mines_pt_2/local" = "[Ari],\n\nОтносно Мините…\n\nЕйланд ме уведоми, че Рангът на града на Мистрия е повишен до Каменна звезда, и се съгласих да се срещна с него, за да обсъдим допълнително Мините.\n\nМоля те, ела при нас на входа на Мините западно от града, [Ari]."
"letters/unlocking_the_mines_pt_2/subject_line" = "Рангът на града на Мистрия"
"quests/story_quests/unlocking_the_mines_pt_2/description" = "Ерол реши, че сме подобрили града достатъчно, за да отключим Мините!\n\nСрещни се с него и Ейланд на входа на Мините."
"quests/story_quests/unlocking_the_mines_pt_2/name" = "Отключване на Мините"
"quests/story_quests/unlocking_the_mines_pt_2/stages/0/objective_description" = "Срещни се с Ерол и Ейланд пред входа на Мините."
