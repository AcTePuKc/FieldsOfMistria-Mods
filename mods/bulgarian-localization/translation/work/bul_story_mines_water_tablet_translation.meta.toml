[asset_properties]
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/init" = "А, здравей, [Ari]! Какво ми носиш?"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/init/prompts/0" = "Разкажи на Ейланд накратко какво се случи в Мините."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/init/prompts/1" = "Преувеличи приключенията си в Мините."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/1" = "Намерил си скрита зала в дълбините на Мините…"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/2" = "Пълна с непознати артефакти…"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/3" = "Включително каменен печат и плоча с непознат език върху нея?"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/4" = "И искаш помощта ми да я преведа?"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/5" = "@НЕВЕРОЯТНО!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet_turn_in/6" = "Да я занесем в кабинета ми!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/init" = "Да си помислиш, че през цялото време това е било под Мистрия!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/1" = "Не ми се иска да го призная, но този превод е малко над възможностите ми…"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/2" = "[Ari], това е написано на език, наречен $вещерски език$. Говорел се е преди много време."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/3" = "Около него има много легенди. Най-впечатляващата гласи, че така хората и драконите първоначално са общували помежду си."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/4" = "Днес знанията ни за него са непълни. Голяма част от разбирането ни идва от ненадеждни вторични източници."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/5" = "Но напоследък започнах да подозирам, че в града може да има някой, който знае много повече за него от мен…"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/5/prompts/0" = "Да отидем да попитаме Джунипър!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/5/prompts/1" = "Балор! Знам, че крие нещо…"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/6" = "Виждам, че мислим еднакво!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/7" = "Сигурна съм, че Балор има много тайни, но едва ли сред тях е познаването на вещерския език."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/8" = "Джунипър е подхвърляла няколко намека за тайнственото и непознатото. Сигурна съм, че може да ни помогне."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/9" = "Подозирам, че ако я помолим да се срещне с нас в Имението, няма да постигнем нищо. Тя ще иска да е на своя територия."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/10" = "Към Баните!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/11" = "Ах, само по лицата ви разбирам, че сте дошли да обсъдите нещо интересно."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/12" = "Тоест интересно за вас. Ако не е интересно за мен, помощта ми ще ви излезе много скъпо."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/13" = "Охо-хо-хо!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/14" = "Както винаги проницателна, Джунипър. Нашият приятел [Ari] намери плоча на вещерски език дълбоко в Мините."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/15" = "Какво!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/16" = "Е, тоест… Предполагам, че мога да погледна."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/17" = "Благодарни сме за помощта ти! Нека те запознаем с подробностите…"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/18" = "Имам някои мисли за синтаксиса на плочата, Джунипър-"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/19" = "Мълчи, зубрачке."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/20" = "Очарователно."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/21" = "Преди да ви кажа какво пише на плочата, имам една молба в замяна."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/22" = "Ако намериш още такива плочи, [Ari], носи претривките направо при мен."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/22/prompts/0" = "Честно е."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/22/prompts/1" = "Хм, не знам…"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/23" = "Разбира се, Джунипър, всички сме заедно в това."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/24" = "Сега не е време за пазарлъци, [Ari]! Съгласни сме!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/25" = "Чудесно! Ще ви го прочета на глас."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/26" = "О, земни смъртни, желаещи да премахнат печата,\nСъберете доказателство за желанието си отново да обедините тези земи,\nПоставете в драконовата лапа четири дара:"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/27" = "От благодатта на земята, един $рубин$;"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/28" = "Уловете бързотечаща $Каменна риба$;"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/29" = "$Молец$, който лети към пламъка;"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/30" = "Една $кафява гъба$ от Мините."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/31" = "Невероятно!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/32" = "Разберете, че на вещерския език това е много по-поетично и изразително, но направих всичко възможно с нашия общ език."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/33" = "Единственото, което познавам, е рубинът, и вярвам, че можеш да го намериш в Мините."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/34" = "Предполагам, че това значи, че и останалите могат да се намерят в Мините."
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/34/prompts/0" = "Можеш да разчиташ на мен!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/34/prompts/1" = "Търсене на съкровища от преди хилядолетия!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/35" = "Сигурна съм, че можем!"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/36" = "Предполагам, че и така може да се погледне на нещата…"
"Cutscenes/Story Events/Mines/translating_the_water_tablet/translating_the_water_tablet/37" = "Каква невероятна загадка! Успех, [Ari]. Ще чакаме новини със затаен дъх."
