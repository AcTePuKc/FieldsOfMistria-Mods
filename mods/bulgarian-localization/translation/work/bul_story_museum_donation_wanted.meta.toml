"letters/museum_donation_wanted/local" = "<he>Скъпи</he><she>Скъпа</she><they>Скъпи</they> [Ari],\n\nКато куратор на Музея на Мистрия с удоволствие споделям, че открихме система от награди по етапи, за да насърчим даренията за колекцията ни.\n\nМоля, отбий се в Музея западно от града при първа възможност."
