"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/3" = "В разговорите ми с лорд Айленд и лейди Аделайн те ме помолиха да се заема с предметите от древността..."
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/4" = "Както и да използвам Музея, за да представя многото уникални образци на Мистрия."
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/5" = "Казано накратко, нека ми носиш не само $археологически находки$, а и местните $растения$, $насекоми$ и $риби$! Вярвам, че заедно ще създадем музей без равен!"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/5/prompts/0" = "Искаш... насекоми?!"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/5/prompts/1" = "Искаш... реколтата ми?!"
