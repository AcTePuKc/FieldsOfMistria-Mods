"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/7" = "И не си мисли, че ще останем неблагодарни — Историческото дружество е предвидило щедри възнаграждения. $Известност$ и всякакви $награди$!"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/8" = "Искаш ли да видиш $Урока за Музея$?"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/8/prompts/0" = "Да"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/8/prompts/1" = "Не"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/9" = "Какво ще кажеш, [Ari]? Можем ли да разчитаме на теб?"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/9/prompts/0" = "Да започваме с разкопките!"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/9/prompts/1" = "Приготви се за тревожно разнообразие от гадинки!"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted/10" = "Чудесно! Като официален оценител ще ти дам малко възнаграждение като приветствие."
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted_follow_up_1/init" = "Ерол говори ли ти за Музея? Фантастично!"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted_follow_up_1/1" = "Знаех, че Историческото дружество на Мистрия може да разчита на подкрепата ти!"
"Cutscenes/Story Events/museum_donation_wanted/museum_donation_wanted_follow_up_5/init" = "О, лорд Айленд ще е във възторг, че подкрепяш Музея. Историческото дружество на Мистрия ти е задължено!"
