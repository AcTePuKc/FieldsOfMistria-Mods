[meta_properties]
id = "fom-bg-work-story-somethings-bugging-me"
asset_kind = "L10nTarget"

[asset_properties]
"quests/story_quests/somethings_bugging_me/name" = "Нещо ме човърка"
"quests/story_quests/somethings_bugging_me/description" = "Притеснява ме, че почти никой не лови насекоми... Трябва да направя нещо!\n\nИСКАШ ли да ловиш насекоми за ЗАБАВЛЕНИЕ и НАУКА? Ела в Хана и ще ти помогна да започнеш!"
"quests/story_quests/somethings_bugging_me/stages/0/objective_description" = "Срещни се с Люк в Хана."
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/init" = "И после стана едно фююю и бзззт, а аз — БУМ!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/1" = "Ооо, невероятно!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/2" = "[Ari], дойде! Искаш ли да станеш ентомолог?"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/3" = "Това е човек, който изучава насекоми."
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/4" = "Да, точно това правя!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/5" = "В Мистрия има страшно много готини насекоми. А господин Ерол от Музея се съгласи да им отдели цяло крило! Толкова съм развълнуван!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/6" = "И ние също! Досега Люк носеше всичките си находки в стаята си..."
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/7" = "Но е голяма работа да си единственият ентомолог в Мистрия! Ще се присъединиш ли към мен?"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/7/prompts/0" = "Ще ги хвана всичките!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/7/prompts/1" = "Не знам дали ще се справя..."
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/8" = "Това искам да чуя!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/9" = "Няма да разбереш, докато не опиташ! Вярвам в теб!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/10" = "Искам да ти дам старата си $мрежа за насекоми$. Носила ми е късмет през годините, но мисля, че е време... да я предам на ново поколение ловци на насекоми."
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/11" = "Гледай само как се справяш!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/12" = "Не забравяй да носиш всяко ново насекомо, което намериш, на Ерол в $Музея$! Само не ги носи тук..."
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me/13" = "Непременно ми разказвай за всякакви интересни насекоми, които намериш, [Ari]!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me_follow_up_1/init" = "Толкова се радвам, че ловиш насекоми, [Ari]!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me_follow_up_1/1" = "Ако ти трябват съвети, питай ме по всяко време. Винаги с радост помагам на нов ентомолог!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me_follow_up_2/init" = "Малкият Люк толкова се развълнува, като те видя да взимаш мрежата за насекоми!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me_follow_up_2/1" = "Напоследък само за това говори!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me_follow_up_3/init" = "[Ari], много мило от твоя страна, че се заинтересува от хобито на Люк с насекомите. Благодаря ти!"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me_follow_up_4/init" = "Младият Люк ти показа чудесата на мрежата за насекоми, така ли?"
"Cutscenes/Story Events/somethings_bugging_me/somethings_bugging_me_follow_up_4/1" = "Непременно ми носи екземплярите, които намериш, за крилото с насекоми на Музея! Ще получиш възнаграждение за приноса си."
