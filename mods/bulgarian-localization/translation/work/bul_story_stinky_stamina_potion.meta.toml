[asset_properties]
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/init" = "Какво правите тук, малки пакостници?"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/1" = "Следваме тази миризма!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/2" = "Онази ужасна миризма!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/3" = "Ако баните можеха да те накарат да миришеш така, нямаше да ги избягвам! Все едно си с... броня от воня!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/4" = "Това в казана не е за банята. То е... тоник за здраве. Само една глътка и веднага ще се освежиш!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/5" = "Никой няма да пие това, щом има толкова лош вкус, колкото мирише."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/6" = "Ах, но още не съм добавила последната съставка. [Ari], ако обичаш?"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/7" = "Готово, тази неприятна миризма веднага изчезна. Не е ли така, [Ari]?"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/7/prompts/0" = "Мирише на стари мокри чорапи..."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/7/prompts/1" = "Мирише на пресен тор..."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/8" = "Очевидно подобрение! А сега кого да изпробваме..."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/9" = "Оо, оо! Аз, аз!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/10" = "Макар да се възхищавам на ентусиазма ти, Дел, мисля, че трябва да наградим този, който донесе последната съставка."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/11" = "Ауу..."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/12" = "Яко!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/13" = "Хм! Много интересно. Люлякът сякаш е обърнал очаквания ефект на отварата."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/14" = "[Ari] не изглежда добре. Трябва да доведем доктор Вален!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/15" = "Ах, няма нужда да намесваме тази жена. Я виж, [Ari]! Защо не отидеш до банята? Аз черпя."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/16" = "Видяхте ли, деца? Всичко е наред. А за да сме сигурни, че няма... остатъчни ефекти. $Следващите ти пет посещения в банята са безплатни$, [Ari]!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/17" = "Кой изобщо би искал да се къпе толкова пъти? Гадост."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/18" = "Благодаря ти отново за помощта, [Ari]. Със сигурност ще се обърна към теб пак. А сега защо всички не се махнете? Трябва да напиша доклада след експеримента."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/19" = "Сигурна ли сте? Можем да измислим МНОГО начини да опишем колко ужасно мирише."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/20" = "Боклук на жегата!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion/21" = "Кучешки оригвания!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_follow_up_1/init" = "Добре ли си, след като изпи от отварата ми? Няма ли дълготрайни ефекти?"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_follow_up_1/1" = "Риторични въпроси, разбира се. Съвсем риторични. Мхм. Е, върви си по пътя, щом си добре."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_follow_up_2/init" = "Казах на госпожица Джунипър, че отварата ѝ мирише толкова зле, че трябва да я нарече обратен парфюм."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_follow_up_2/1" = "Тя ме изхвърли от банята!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_follow_up_3/init" = "Отварата на госпожица Джунипър миришеше доста зле, а?"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_follow_up_3/1" = "Когато стана кралица, ще я направя кралска отровителка."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_follow_up_4/init" = "Не мисля, че в природата има миризма, толкова ужасна колкото отварата на госпожица Джунипър. А ТИ я изпи. Уау!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_follow_up_4/1" = "Човечеството наистина е способно на всичко."
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_lilac/init" = "Търсиш $люляк$? Мисля, че съм виждал да расте край фермата на Хейдън!"
"Cutscenes/Story Events/stinky_stamina_potion/stinky_stamina_potion_lilac/1" = "Фермата на Хейдън е $на запад от твоята ферма$, ако още не си ходил там."
