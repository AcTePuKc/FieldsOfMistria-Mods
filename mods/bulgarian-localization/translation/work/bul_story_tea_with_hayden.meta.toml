"letters/tea_with_hayden/local" = "[Ari],\nНе мога да ти се отблагодаря достатъчно за работата по Мелницата!\n\nАко имаш време, ела у нас! Ще сложа чайника и ще поговорим за животновъдство и отглеждане на животни."
"quests/story_quests/tea_with_hayden/name" = "Чай с Хейдън"
"quests/story_quests/tea_with_hayden/description" = "Не мога да ти се отблагодаря достатъчно за работата по Мелницата, [Ari]!\n\nАко имаш време, ела у нас. Ще сложа чайника и ще поговорим за животновъдство и отглеждане на животни!"
"quests/story_quests/tea_with_hayden/stages/0/objective_description" = "Срещни се с Хейдън у дома му, западно от фермата ти."
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/init" = "Благодаря, че мина! Влизай, отпусни се!"
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/1" = "Значи искаш да отглеждаш $животни$? Имам богат избор за теб, [Ari]!"
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/2" = "Ако ги $храниш$, $галиш$ и $извеждаш навън в хубави дни$, ще те възнаградят с всякакви чудесни продукти!"
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/3" = "Пресните $яйца$ и $мляко$ са много полезни, ако обичаш $готвенето$. А можеш и да ги продадеш за добра печалба!"
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/4" = "Някои животни дори дават полезни материали за изработка, като $пера$ и $вълна$."
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/5" = "В Мистрия се провежда и ежегоден $Фестивал на животните$ с чудесни награди..."
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/6" = "Макар че конкуренцията с моята Хенриета може да ти дойде малко тежка!"
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/7" = "Ако $развъждаш$ животните си със $сърцевидни лакомства$, можеш дори да ги съчетаеш, за да получиш $редки окраски$!"
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/8" = "Ето малко $смлян фураж$, за да започнеш, но не забравяй, че могат и да $пасат$, а можеш и да ги $храниш на ръка$ като лакомство."
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/9" = "Е, мисля, че засега това е всичко."
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/10" = "Не изчезвай, [Ari]! Личи си, че Хенриета оценява компанията ти, а и аз също!"
"Cutscenes/Story Events/tea_with_hayden/tea_with_hayden/tutorial_prompt" = "Искаш ли да видиш $Урока по животновъдство$?"
