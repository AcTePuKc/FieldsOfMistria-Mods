asset_kind = "L10nTarget"

[asset_properties]
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/init" = "А, добро утро, [Ari]! Онзи ден забелязах нещо подозрително около това дърво. Мисля, че покрива стар каменен градеж."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/1" = "Като председател на Историческото дружество реших да проуча, но тази стара кора се оказа изненадващо здрава..."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/1/prompts/0" = "Историческо дружество?"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/1/prompts/1" = "Доста е рано за такива неща."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/2" = "Хаха, имам предвид Ерол, Терития и Олрик... ако успее да си спомни. Ще се радвам да се присъединиш към нас!"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/3" = "Ужасно съжалявам! Не спирам да мисля за това и просто трябваше да проуча. Какво ще кажеш да ти дам почетно членство, за да се реванширам?"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/4" = "Фух... Май ми трябва малко почивка."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/4/prompts/0" = "Дай да опитам аз!"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/4/prompts/1" = "Дай ми брадвата и ще се оправя!"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/5" = "О, разбира се! Ето, можеш да вземеш моята $брадва$."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/6" = "Хаха, тогава е твоя!"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/7" = "Невероятно!"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/8" = "Това е статуя на $Калдаръс$, митичния пазител на Мистрия. Древните ни предци са почитали статуи като тази. Каква невероятна находка!"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/9" = "Жалко за главата, но с малко помощ от най-новото попълнение в Историческото дружество мисля, че ще го възстановим като нов. Ще помогнеш ли, [Ari]?"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/10" = "Ето така! Не обичаш ли това чувство на постигнат успех?"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/11" = "Вярвам, че връзката с миналото на Мистрия е ключът към бъдещето ни."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1/12" = "Това беше изключително ползотворна сутрин! Благодаря ти за цялата помощ. Запази $брадвата$ и непременно ми кажи, ако попаднеш на интересни археологически находки!"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1_follow_up_1/init" = "Ейланд изтича до дома ти, защото се е развълнувал за древен артефакт? Това почти е обред за посвещаване в Мистрия."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1_follow_up_1/1" = "Той наистина е запален по историята."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1_follow_up_2/init" = "Лорд Ейланд сам възроди Историческото дружество на Мистрия! Неуморен е в търсенето на древни артефакти."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1_follow_up_2/1" = "Той вярва, че всички стари реликви имат предназначение! Дори стар миньор като мен, хаха!"
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1_follow_up_3/init" = "Чух, че Ейланд е открил древна статуя във фермата ти! Това често се случва тук."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1_follow_up_3/1" = "Дори каза, че Ханът на Спящия дракон е историческа забележителност! Като се замисля, наистина е доста стар."
"Cutscenes/Story Events/the_unusual_tree_pt_1/the_unusual_tree_pt_1_follow_up_3_hemlock/init" = "Чух, че Ейланд е открил древна статуя във фермата ти! Това често се случва тук."
