[asset_properties]
"Cutscenes/Story Events/day_zero/day_zero/init" = "Здравей!"
"Cutscenes/Story Events/day_zero/day_zero/1" = "Не очаквах да видя някого тук. Пътищата са в ужасно състояние след $земетресението$."
"Cutscenes/Story Events/day_zero/day_zero/2" = "Аз съм Балор, пътуващ търговец. Приятно ми е да се запознаем."
"Cutscenes/Story Events/day_zero/day_zero/3" = "Да позная, тук си по молба на лейди Аделин? Тя спомена, че някой е приел предложението ѝ."
"Cutscenes/Story Events/day_zero/day_zero/3/prompts/0" = "Каза, че търси <he>„способен приключенец“</he><she>„способна приключенка“</she><they>„човек с приключенски умения“</they>!"
"Cutscenes/Story Events/day_zero/day_zero/3/prompts/1" = "Нещо за безплатна земя и къща..."
"Cutscenes/Story Events/day_zero/day_zero/4" = "Определено би ни помогнал такъв човек! Има много работа, за да върнем Мистрия на крака."
"Cutscenes/Story Events/day_zero/day_zero/5" = "Виждал съм района! Чудесно място е, съвсем близо до града."
"Cutscenes/Story Events/day_zero/day_zero/6" = "Ще те придружа през останалата част от пътя, ако нямаш нищо против компанията. Откакто мостът се срути, каруците не могат да минават, така че нося пеша каквото успея."
"Cutscenes/Story Events/day_zero/day_zero/7" = "Чудесно, да вървим!"
"Cutscenes/Story Events/day_zero/day_zero/8" = "Уф!"
"Cutscenes/Story Events/day_zero/day_zero/9" = "Трябва да стигнем преди да се стъмни. Хайде, ще отидем направо до новата ти ферма!"
"Cutscenes/Story Events/day_zero/day_zero/10" = "Лорд Айленд! Виж кого намерих на края на гората!"
"Cutscenes/Story Events/day_zero/day_zero/11" = "[Ari], предполагам! <he>Добре дошъл, добре дошъл</he><she>Добре дошла, добре дошла</she><they>Добре дошли, добре дошли</they>! Аз съм Айленд, много ми е приятно да се запознаем!"
"Cutscenes/Story Events/day_zero/day_zero/12" = "В добри ръце си, [Ari]. Отивам към хана, денят беше дълъг и имам нужда от топла храна. Ще се видим!"
"Cutscenes/Story Events/day_zero/day_zero/13" = "Е, какво мислиш? Хубаво е, нали? Точно извън града си, а почвата е чудесна за земеделие..."
"Cutscenes/Story Events/day_zero/day_zero/14" = "А виж тази къща! Четири здрави стени с богата история! Да влезем вътре, а?"
"Cutscenes/Story Events/day_zero/day_zero/15" = "Ад-"
"Cutscenes/Story Events/day_zero/day_zero/16" = "С-само минутка!"
"Cutscenes/Story Events/day_zero/day_zero/17" = "Изглежда, ъъ, че още не сме напълно готови за теб."
"Cutscenes/Story Events/day_zero/day_zero/18" = "Но не се тревожи! Сигурен съм, че ще ѝ трябва само минутка."
"Cutscenes/Story Events/day_zero/day_zero/18/prompts/0" = "Да влезем ли да помогнем...?"
"Cutscenes/Story Events/day_zero/day_zero/18/prompts/1" = "Свикнал съм да се оправям и сам."
"Cutscenes/Story Events/day_zero/day_zero/19" = "Няма нужда!"
"Cutscenes/Story Events/day_zero/day_zero/20" = "Ха-ха..."
"Cutscenes/Story Events/day_zero/day_zero/21" = "Ти трябва да си [Ari]! Аз съм Аделин, много ти благодаря, че отговори на молбата ми!"
"Cutscenes/Story Events/day_zero/day_zero/22" = "С брат ми сме много развълнувани, че тук ще ни помага <he>истински приключенец</he><she>истинска приключенка</she><they>човек с истински приключенски дух</they>."
"Cutscenes/Story Events/day_zero/day_zero/23" = "Надявам се да ти хареса новата ти ферма! Има голям потенциал, не мислиш ли?"
"Cutscenes/Story Events/day_zero/day_zero/24" = "Защо не влезеш?"
"Cutscenes/Story Events/day_zero/day_zero/25" = "<he>Добре дошъл</he><she>Добре дошла</she><they>Добре дошли</they> в новия ти дом!"
"Cutscenes/Story Events/day_zero/day_zero/25/prompts/0" = "Колко е уютно!"
"Cutscenes/Story Events/day_zero/day_zero/25/prompts/1" = "Еха, това стана бързо!"
"Cutscenes/Story Events/day_zero/day_zero/26" = "Радвам се, че мислиш така!"
"Cutscenes/Story Events/day_zero/day_zero/27" = "Хаха..."
"Cutscenes/Story Events/day_zero/day_zero/28" = "Искаш ли набързо да ти покажа стаята?"
"Cutscenes/Story Events/day_zero/day_zero/28/prompts/0" = "Да, моля!"
"Cutscenes/Story Events/day_zero/day_zero/28/prompts/1" = "Добре съм!"
"Cutscenes/Story Events/day_zero/day_zero/29" = "Чудесно!"
"Cutscenes/Story Events/day_zero/day_zero/30" = "Разбира се!"
"Cutscenes/Story Events/day_zero/day_zero/31" = "Това тук е твоят $дневник$! Можеш да пишеш в него, когато искаш да $записваш историята си$."
"Cutscenes/Story Events/day_zero/day_zero/32" = "А това, разбира се, е новото ти $легло$!"
"Cutscenes/Story Events/day_zero/day_zero/33" = "Не забравяй да си легнеш до $2 ч. през нощта$ всеки ден, за да поддържаш нивото на $издръжливостта$ си."
"Cutscenes/Story Events/day_zero/day_zero/34" = "Поставили сме и този $календар$ за теб. Можеш да го използваш, за да проверяваш кога в Мистрия се провеждат $фестивалите$ и кога са $рождените дни$ на всички жители на града!"
"Cutscenes/Story Events/day_zero/day_zero/35" = "А този $сандък за съхранение$ е изработен от местния дърводелец на Мистрия, Райс!"
"Cutscenes/Story Events/day_zero/day_zero/36" = "Можеш да $съхраняваш предмети$ тук, ако чантата ти започне да се препълва."
"Cutscenes/Story Events/day_zero/day_zero/37" = "И това е всичко от обиколката!"
"Cutscenes/Story Events/day_zero/day_zero/38" = "Помислих, че може да си <he>гладен</he><she>гладна</she><they>гладни</they>, когато пристигнеш, затова минах през хана и взех купа от прочутата им $зеленчукова супа$!"
"Cutscenes/Story Events/day_zero/day_zero/39" = "Сигурно си <he>изморен</he><she>изморена</she><they>изморени</they> от пътуването. Няма да те задържаме повече."
"Cutscenes/Story Events/day_zero/day_zero/40" = "<he>Добре дошъл</he><she>Добре дошла</she><they>Добре дошли</they> в Мистрия, [Ari]. Радваме се, че си тук!"
"Cutscenes/Story Events/day_zero/day_zero/41" = "Нека се срещнем утре, за да започнем да обсъждаме плановете си за възстановяването на града."
