[asset_properties]
"Cutscenes/Story Events/prologue/prologue/init" = "Още ли работиш, сестричке?"
"Cutscenes/Story Events/prologue/prologue/1" = "О, Айленд!"
"Cutscenes/Story Events/prologue/prologue/2" = "Не усетих колко късно е станало."
"Cutscenes/Story Events/prologue/prologue/3" = "Помислих, че ще ти се услади чаша горещо кафе."
"Cutscenes/Story Events/prologue/prologue/4" = "Благодаря!"
"Cutscenes/Story Events/prologue/prologue/5" = "Как върви планът за възстановяване на града?"
"Cutscenes/Story Events/prologue/prologue/6" = "Мисля, че почти е готов."
"Cutscenes/Story Events/prologue/prologue/7" = "Описах щетите от земетресението и изброих необходимите ремонти..."
"Cutscenes/Story Events/prologue/prologue/8" = "Дори направих планове да попълним запасите за извънредни ситуации до края на лятото!"
"Cutscenes/Story Events/prologue/prologue/9" = "Единственото, което ни липсва сега, е помощ, за да довършим всичко."
"Cutscenes/Story Events/prologue/prologue/10" = "След като майка ни и баща ни бяха повикани в Столицата, а и много хора си тръгнаха след земетресението, определено останаха по-малко хора, които да помагат."
"Cutscenes/Story Events/prologue/prologue/11" = "Само да можехме да привлечем нови жители да се преместят тук..."
"Cutscenes/Story Events/prologue/prologue/12" = "Мистрия е толкова красиво място! Очарованието на малкия град, богатата история на района, ширналите се земеделски земи..."
"Cutscenes/Story Events/prologue/prologue/13" = "Точно така! Старата ферма на юг от града!"
"Cutscenes/Story Events/prologue/prologue/14" = "Защо не изпратим известие до Гилдията на приключенците в столицата?"
"Cutscenes/Story Events/prologue/prologue/15" = "Някой със сигурност ще се съгласи да помогне на града срещу земя с такъв потенциал."
"Cutscenes/Story Events/prologue/prologue/16" = "Страхотна идея!"
"Cutscenes/Story Events/prologue/prologue/17" = "Ще се заема веднага. Благодаря ти, Айленд."
"Cutscenes/Story Events/prologue/prologue/18" = "Чудя се кой ли ще откликне на призива..."
"misc_local/character_customization" = "Персонализиране на героя"
"misc_local/enter_new_name" = "Въведи ново име"
