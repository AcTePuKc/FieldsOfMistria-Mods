[asset_properties]
"ui/tutorials/void_sight/steps/0/text" = "Погледът към Бездната е пасивно умение, което\nще ти позволява да виждаш различни\nматериали от Бездната в Мините."
"ui/tutorials/void_sight/steps/1/text" = "Можеш да събираш камъни от Бездната,\nкато разбиеш всеки от тях с кирка."
"ui/tutorials/void_sight/steps/2/text" = "Перли от Бездната могат да се намерят,\nкато уловиш малки сенки на риби."
"ui/tutorials/void_sight/steps/3/text" = "Прах от Бездната понякога се получава,\nкогато победиш чудовища."
"ui/tutorials/void_sight/steps/4/text" = "Билки от Бездната могат да се намерят и\nнаберат от земята."
"ui/tutorials/void_sight/title" = "Урок: Поглед към Бездната"
