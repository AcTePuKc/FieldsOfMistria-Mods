# Test-only Font Lab input.  The generator copies each untouched source font
# into a distinct engine asset because font metadata is read with the asset.

[[font]]
id = "ibm_plex"
label = "IBM Plex"
source = "fonts/fnt_font_choices_ibm_plex.ttf"
languages = ["eng", "bul", "fra", "spa", "rus", "por", "pol"]

[[font.variant]]
id = "compact_shaded"
label = "Compact — 14x12 — shaded"
size = 14
line_height = 12
allow_shading = true
short_label = "Compact"
targets = ["all", "standard", "popup_description", "textbox"]
languages = ["eng", "bul", "fra", "spa", "rus", "por", "tur"]

