[meta_properties]
id = "fom-bg-work-dates"
asset_kind = "L10nTarget"

[asset_properties]
"ui/tutorials/dates/steps/0/text" = "Можеш да започнеш да се срещаш с някого, след като избереш „романтичната линия“ в събитието му за 8 сърца!"
"ui/tutorials/dates/steps/1/text" = "Можеш да се срещаш с повече от един човек, но имай предвид, че можеш да сключиш брак само с един."
"ui/tutorials/dates/steps/2/text" = "След като започнеш да се срещаш с някого, можеш да го поканиш на среща в събота или неделя."
"ui/tutorials/dates/steps/3/text" = "Можеш да ходиш само на една среща седмично с всеки човек, с когото се срещаш."
"ui/tutorials/dates/steps/4/text" = "Ако се срещаш с двама души, можеш да поканиш някого на среща и в събота, и в неделя."
"ui/tutorials/dates/steps/5/text" = "Предметите с идеи за срещи могат да се използват за отключване на нови видове срещи!"
"ui/tutorials/dates/steps/6/text" = "Предмети с идеи за срещи могат да се намират при различни дейности и дори да се купят от определен търговец."
"ui/tutorials/dates/steps/7/text" = "Събирай снимки от срещи, когато за първи път отидеш на нов вид среща с някого!"
"ui/tutorials/dates/steps/8/text" = "Постави снимките от срещи по стените в дома си, за да ги разглеждаш по всяко време."
"ui/tutorials/dates/steps/9/text" = "В бъдеща актуализация, когато горната граница на сърцата бъде увеличена, срещите ще дават повече точки за сърца от подаръците."
"ui/tutorials/dates/title" = "Урок: Срещи"
